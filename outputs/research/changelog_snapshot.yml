                - listitem [ref=e1542]: selection of analytical methods and relevant standards;
                - listitem [ref=e1543]: where applicable, management of sampling and sample preparation, including control of sample integrity; where applicable, development and validation of new analytical methods or application of methods not covered by international or national standards;
                - listitem [ref=e1544]: uncertainty estimation;
                - listitem [ref=e1545]: management of equipment, including procedures for calibration, adjustment, maintenance and repair of equipment, and record keeping thereof;
                - listitem [ref=e1546]: management and control of data, documents and software;
                - listitem [ref=e1547]: management of calibration items and reference materials; quality assurance for calibration and test results, including regular participation in proficiency testing schemes, applying analytical methods to certified reference materials, or inter-comparison with an accredited laboratory;
                - listitem [ref=e1548]: management of outsourced processes;
                - listitem [ref=e1549]: management of assignments, customer complaints, and ensuring timely corrective action.
            - generic [ref=e1550]:
              - heading "6.7.3 Climate Change Adaptation" [level=4] [ref=e1551]
              - paragraph [ref=e1552]: "Project Proponents must include in their PDD a robust climate risk and vulnerability assessment with the following steps:"
              - list [ref=e1553]:
                - listitem [ref=e1554]:
                  - text: screening of the Project to identify which physical climate risks from the list in
                  - link "Section II of Appendix A of Regulation 2021/2139" [ref=e1555] [cursor=pointer]:
                    - /url: https://eur-lex.europa.eu/eli/reg_del/2021/2139/oj#ntc1-L_2021442EN.01014001-E0001
                  - text: may affect the performance of the Project during its expected lifetime;
                - listitem [ref=e1556]: where the Project is assessed to be at risk from one or more of the physical climate risks listed in the same Appendix, a climate risk and vulnerability assessment to assess the materiality of the physical climate risks on the Project;
                - listitem [ref=e1557]: an assessment of adaptation solutions that can reduce the identified physical climate risk.
              - paragraph [ref=e1558]: "The climate risk and vulnerability assessment is proportionate to the scale of the Project and its expected lifespan, such that:"
              - list [ref=e1559]:
                - listitem [ref=e1560]: for Projects with an expected lifespan of less than 10 years, the assessment is performed, at least by using climate projections at the smallest appropriate scale;
                - listitem [ref=e1561]: for all other Projects, the assessment is performed using the highest available resolution, state-of-the-art climate projections across the existing range of future scenarios consistent with the expected lifetime of the activity, including, at least, 10 to 30 year climate projections scenarios for major investments;
                - listitem [ref=e1562]:
                  - text: the range of future scenarios are the IPCC representative concentration pathways
                  - link "RCP2.6, RCP4.5, RCP6.0 and RCP8.5" [ref=e1563] [cursor=pointer]:
                    - /url: "#httpslinkspringercomarticle101007s10584-011-0148-z"
                  - text: .
              - paragraph [ref=e1564]: The climate projections and assessment of impacts are based on best practice and available guidance and take into account the state-of-the-art science for vulnerability and risk analysis and related methodologies in line with the most recent IPCC reports, scientific peer-reviewed publications, and open source or paid models.
              - paragraph [ref=e1565]: For existing Projects and new Projects using existing physical assets, the Project Proponent must prepare and execute a plan for adaptation solutions, over a period of time of up to five years, that reduce the most important identified physical climate risks that are material to that Project.
              - paragraph [ref=e1566]: For new Projects and existing Projects using newly-built physical assets, the Project Proponent must integrate the adaptation solutions that reduce the most important identified physical climate risks that are material to that activity at the time of design and construction before the start of operations.
              - paragraph [ref=e1567]:
                - text: The adaptation solutions implemented must not adversely affect the adaptation efforts or the level of resilience to physical climate risks of other people, of nature, of cultural heritage, of assets and of other economic activities; and be consistent with local, sectoral, regional or national adaptation strategies and plans; and consider the use of
                - link "nature-based solutions" [ref=e1568] [cursor=pointer]:
                  - /url: https://ec.europa.eu/research/environment/index.cfm?pg=nbs
                - text: or rely on
                - link "blue or green infrastructure" [ref=e1569] [cursor=pointer]:
                  - /url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex:52013DC0249
                - text: to the extent possible.
            - generic [ref=e1570]:
              - heading [level=3] [ref=e1571]:
                - text: "6.8"
                - strong [ref=e1572]:
                  - insertion [ref=e1573]:
                    - insertion [ref=e1574]: Publication of content
              - paragraph [ref=e1575]:
                - insertion [ref=e1576]: "In accordance with the requirements of Regulation (EU) 2024/3012, Isometric will make publicly available the following information related to its role as a Certification Scheme under the CRCF:"
              - list [ref=e1577]:
                - listitem [ref=e1578]:
                  - insertion [ref=e1579]: Contact information of Isometric, including postal address and email address.
                - listitem [ref=e1580]:
                  - insertion [ref=e1581]: The most recent version of Isometric’s governance rules and procedures, including the roles and responsibilities of all relevant bodies; details concerning the Board of Directors, Secretariat, and Technical Committee, or their equivalents; the registry of scheme participants; and comprehensive guidelines for the conduct of audits. Each rules and procedures document will include a date and version number and, where applicable, will summarise any changes made compared to the previous version of the document.
                - listitem [ref=e1582]:
                  - insertion [ref=e1583]: Each rules and procedures document will include a date and version number and, where applicable, will summarise any changes made compared to the previous version of the document.
                - listitem [ref=e1584]:
                  - insertion [ref=e1585]: The rules underlying the calculation of Isometric’s fees.
                - listitem [ref=e1586]:
                  - insertion [ref=e1587]: A link to the complaint submission and assessment procedures, including appeal procedures.
                - listitem [ref=e1588]:
                  - insertion [ref=e1589]: The actions taken by the certification scheme as a result of a complaint.
                - listitem [ref=e1590]:
                  - insertion [ref=e1591]: Operators with a withdrawn certificate, terminated certificate or expired certificate, for at least 36 months after the date of withdrawal, termination or expiry of the certificate.
                - listitem [ref=e1592]:
                  - insertion [ref=e1593]: Isometric will publish without delay any changes in the certification status of operators.
                - listitem [ref=e1594]:
                  - insertion [ref=e1595]: Certification bodies that are no longer entitled to conduct auditing under Isometric will be listed for at least 24 months on the scheme's website after the last audit with an indication to that effect.
              - paragraph [ref=e1596]:
                - insertion [ref=e1597]: "Isometric will also publish an Annual Operation Report covering the preceding calendar year, which will contain the following material:"
              - list [ref=e1598]:
                - listitem [ref=e1599]:
                  - insertion [ref=e1600]: Information on market uptake, including the number and type of certified projects (categorised in accordance with the applicable CRCF methodology), and the amount, type and status of the certified CRCF units managed by Isometric;.
                - listitem [ref=e1601]:
                  - insertion [ref=e1602]: An overview of the activities carried out by Isometric in cooperation with the certification bodies in order to improve the overall certification process and the qualification and independence of auditors.
                - listitem [ref=e1603]:
                  - insertion [ref=e1604]: An overview of the internal monitoring system and of its periodic review, including oversight of the work of certification bodies and their auditors. This overview will describe how the system effectively prevents fraudulent activities and this will record the number of cases of fraud or irregularities detected;
                - listitem [ref=e1605]:
                  - insertion [ref=e1606]: An overview of stakeholder engagement activities, including public consultations;
                - listitem [ref=e1607]:
                  - insertion [ref=e1608]: An overview of complaints received and, where relevant, any remedial measures or changes to the governance system necessary as part of the internal monitoring;
                - listitem [ref=e1609]:
                  - insertion [ref=e1610]: An overview of identified cases of non-conformity by operators or certification bodies, the number and description of cases where fraud has been identified, and an action plan setting out how each complaint or identified non-conformity is to be resolved; and
                - listitem [ref=e1611]:
                  - insertion [ref=e1612]: The criteria and process for the appointment of certification bodies.
            - generic [ref=e1613]:
              - heading [level=3] [ref=e1614]:
                - insertion [ref=e1615]: "6.9"
                - text: CRCF Glossary
              - paragraph [ref=e1616]: CRCF - stands for Carbon Removals and Carbon Farming and is an EU-wide voluntary framework for certifying carbon removals, carbon farming and carbon storage in products.
              - paragraph [ref=e1617]: CRCF Certificate of Compliance - A conformity statement issued by a certification body certifying that a project complies with Regulation (EU) 2024/3012; equivalent to an Isometric Verification Report in conjunction with the Project Validation Report.
              - paragraph [ref=e1618]: CRCF Certified Unit - a Credit issued in accordance with Regulation (EU) 2024/3012
              - paragraph [ref=e1619]: CRCF Activity - equivalent to an Isometric Project
              - paragraph [ref=e1620]: CRCF Operator - equivalent to an Isometric Project Proponent
              - paragraph [ref=e1621]: CRCF Certification Body - equivalent to a VVB
              - paragraph [ref=e1622]: CRCF Certification Audit - equivalent to an Isometric Validation
              - paragraph [ref=e1623]: CRCF Re-certification Audit - equivalent to an Isometric Verification
              - paragraph [ref=e1624]: CRCF Activity Period - equivalent to an Isometric Crediting Period
              - paragraph [ref=e1625]: CRCF Certification Period - equivalent to an Isometric Reporting Period
              - paragraph [ref=e1626]: CRCF Activity Plan - equivalent to an Isometric Project Design Document (PDD) (The document that clearly outlines how a Project will generate rigorously quantifiable Additional high-quality Removals or Reductions.)
              - paragraph [ref=e1627]: CRCF Monitoring Plan - equivalent to the Monitoring Plan section of each Isometric Project Design Document (PDD) (The document that clearly outlines how a Project will generate rigorously quantifiable Additional high-quality Removals or Reductions.)
              - paragraph [ref=e1628]: CRCF Monitoring Report - equivalent to the GHG Statement submitted during Verification of Credits
              - paragraph [ref=e1629]:
                - insertion [ref=e1630]: CRCF Monitoring Audit - an audit carried out by a certification body during the monitoring period to verify monitoring of stored carbon and any reversals
              - paragraph [ref=e1631]:
                - insertion [ref=e1632]: CRCF Withdrawn Certificate - a certificate that has been permanently canceled by the certification body or the certification scheme
              - paragraph [ref=e1633]:
                - insertion [ref=e1634]: CRCF Expired Certificate - a certificate that is no longer valid
              - paragraph [ref=e1635]:
                - insertion [ref=e1636]: CRCF Terminated Certificate - a certificate that has been voluntarily cancelled while it is still valid
              - paragraph [ref=e1637]:
                - insertion [ref=e1638]: CRCF Non-conformity - a failure by an operator or a certification body to comply with the rules and procedures established by the certification scheme, of which they are members or under which they operate
            - generic [ref=e1639]:
              - heading "7.0 Definitions and Acronyms" [level=2] [ref=e1640]
              - generic [ref=e1641]:
                - generic [ref=e1642]:
                  - term
                  - definition [ref=e1643]: A database that holds information on Verified Removals and Reductions, and reviewed EACs, based on Protocols. Registries Issue Certificates, and track their ownership and Retirement.
                - generic [ref=e1644]:
                  - term
                  - definition [ref=e1645]: A publicly visible uniquely identifiable Credit Certificate Issued by a Registry that gives the owner of the Credit the right to account for one net metric tonne of Verified CO₂e Removal or Reduction. In the case of this Standard, the net tonne of CO₂e Removal or Reduction comes from a Project Validated against a Certified Protocol.
                - generic [ref=e1646]:
                  - term
                  - definition [ref=e1647]: The term used to represent the CO₂ taken out of the atmosphere as a result of a CDR process.
                - generic [ref=e1648]:
                  - term
                  - definition [ref=e1649]: The term used to represent the reduction of greenhouse gasses emitted into the atmosphere from an existing emitter as a result of an emission reduction process.
                - generic [ref=e1650]:
                  - term
                  - definition [ref=e1651]: The outcome of a Project Proponent providing Credits to fulfill Buyers' purchases.
                - generic [ref=e1652]:
                  - term
                  - definition [ref=e1653]: An evaluation of the likelihood that an intervention causes a climate benefit above and beyond what would have happened in a no-intervention Baseline scenario.
                - generic [ref=e1654]:
                  - term
                  - definition [ref=e1655]: A lack of knowledge of the exact amount of CO₂ removed by a particular process, Uncertainty may be quantified using probability distributions, confidence intervals, or variance estimates.
                - generic [ref=e1656]:
                  - term
                  - definition [ref=e1657]: A process for evaluating and confirming the net Removals and Reductions for a Project, using data and information collected from the Project and assessing conformity with the criteria set forth in the Isometric Standard and the Protocol by which it is governed. Verification must be completed by an Isometric approved third-party (VVB).
                - generic [ref=e1658]:
                  - term
                  - definition [ref=e1659]: Certificates are issued to the Certificate Account of a Project Proponent with whom Isometric has a Validated Protocol after an Order for Verification and Certificate Issuance services from a Buyer and once a Verified Removal or Reduction has taken place.
                - generic [ref=e1660]:
                  - term
                  - definition [ref=e1661]: The scope of Isometric which involves all of the processes relevant to the entire life cycle of a Credit.
                - generic [ref=e1662]:
                  - term
                  - definition [ref=e1663]: A nonprofit, usually with a societal, scientific, or political purpose; by definition an NGO is not associated with a governmental entity.
                - generic [ref=e1664]:
                  - term
                  - definition [ref=e1665]: Any person or entity who can potentially affect or be affected by Isometric or an individual Project activity.
                - generic [ref=e1666]:
                  - term
                  - definition [ref=e1667]: Isometric's proprietary code and processes that create/contain intellectual property (IP) and enable the Registry to function smoothly.
                - generic [ref=e1668]:
                  - term
                  - definition [ref=e1669]: Improperly allocating the same Removal or Reduction from a Project Proponent more than once to multiple Buyers.
                - generic [ref=e1670]:
                  - term
                  - definition [ref=e1671]: The organization that develops and/or has overall legal ownership or control of a Removal or Reduction Project.
                - generic [ref=e1672]:
                  - term
                  - definition [ref=e1673]: A contract in which a Buyer agrees to purchase a set Removal and/or Reduction at a set price.
                - generic [ref=e1674]:
                  - term
                  - definition [ref=e1675]: The Isometric process which involves expert review and Public Consultation in order to arrive at an approved version of a Protocol, against which Projects will be Validated and Removals or Reductions will be Verified.
                - generic [ref=e1676]:
                  - term
                  - definition [ref=e1677]: A document that describes how to quantitatively assess the net amount of CO₂ removed by a process. To Isometric, a Protocol is specific to a Project Proponent's process and comprised of Modules representing the Carbon Fluxes involved in the CDR process. A Protocol measures the full carbon impact of a process against the Baseline of it not occurring.
                - generic [ref=e1678]:
                  - term
                  - definition [ref=e1679]: Third-party auditing organizations that are experts in their sector and used to determine if a project conforms to the rules, regulations, and standards set out by a governing body. A VVB must be approved by Isometric prior to conducting validation and verification.
                - generic [ref=e1680]:
                  - term
                  - definition [ref=e1681]: An activity or process or group of activities or processes that alter the condition of a Baseline and leads to Removals or Reductions.
                - generic [ref=e1682]:
                  - term
                  - definition [ref=e1683]: The amount of carbon exchanged between two or more Reservoirs over a period of time.
                - generic [ref=e1684]:
                  - term
                  - definition [ref=e1685]: Those gaseous constituents of the atmosphere, both natural and anthropogenic (human-caused), that absorb and emit radiation at specific wavelengths within the spectrum of terrestrial radiation emitted by the Earth’s surface, by the atmosphere itself, and by clouds. This property causes the greenhouse effect, whereby heat is trapped in Earth’s atmosphere (CDR Primer, 2022).
                - generic [ref=e1686]:
                  - term
                  - definition [ref=e1687]: Purposefully erring on the side of caution under conditions of Uncertainty by choosing input parameter values that will result in a lower net CO₂ Removal or GHG Reduction than if using the median input values. This is done to increase the likelihood that a given Removal or Reduction calculation is an underestimation rather than an overestimation.
                - generic [ref=e1688]:
                  - term
                  - definition [ref=e1689]: The increase in GHG emissions outside the geographic or temporal boundary of a project that results from that project's activities.
                - generic [ref=e1690]:
                  - term
                  - definition [ref=e1691]: The organization benefiting from the Removal or Reduction claim afforded by a Certificate. This may be the current holder of the Certificate at the time of Retirement, or an organization specified by the Certificate account holder during the Retirement procedure.
                - generic [ref=e1692]:
                  - term
                  - definition [ref=e1693]: A calculation, series of calculations or simulations that use input variables in order to generate values for variables of interest that are not directly measured.
                - generic [ref=e1694]:
                  - term
                  - definition [ref=e1695]: Independent components of Isometric Certified Protocols which are transferable between and applicable to different Protocols.
                - generic [ref=e1696]:
                  - term
                  - definition [ref=e1697]: A systematic and independent process for evaluating the reasonableness of the assumptions, limitations and methods that support a Project and assessing whether the Project conforms to the criteria set forth in the Isometric Standard and the Protocol by which the Project is governed. Validation must be completed by an Isometric approved third-party (VVB).
                - generic [ref=e1698]:
                  - term
                  - definition [ref=e1699]: The Isometric group aimed at bringing together scientists working in industry, academia, NGOs and more to promote more efficient collaboration across the CDR ecosystem.
                - generic [ref=e1700]:
                  - term
                  - definition [ref=e1701]: The process by which a Protocol or Module is made available to the public for comment on the Isometric Registry.
                - generic [ref=e1702]:
                  - term
                  - definition [ref=e1703]: Considering impacts at each stage of a product's life cycle, from the time natural resources are extracted from the ground and processed through each subsequent stage of manufacturing, transportation, product use, and ultimately, disposal.
                - generic [ref=e1704]:
                  - term
                  - definition [ref=e1705]: A document submitted alongside Claimed Removals and/or Reductions that details the calculations associated with a Removal or Reduction, including the Project's emissions, Removals, Reductions and Leakages, presented together in net metric tonnes of CO₂e per Removal or Reduction.
                - generic [ref=e1706]:
                  - term
                  - definition [ref=e1707]: Document submitted alongside a GHG Statement to provide supporting information and justification.
                - generic [ref=e1708]:
                  - term
                  - definition [ref=e1709]: The defined temporal and geographical boundary of a Project.
                - generic [ref=e1710]:
                  - term
                  - definition [ref=e1711]: GHG sources, sinks and reservoirs (SSRs) associated with the project boundary and included in the GHG Statement.
                - generic [ref=e1712]:
                  - term
                  - definition [ref=e1713]: Any process or activity that releases a greenhouse gas, an aerosol, or a precursor of a greenhouse gas into the atmosphere.
                - generic [ref=e1714]:
                  - term
                  - definition [ref=e1715]: Any process, activity, or mechanism that removes a greenhouse gas, a precursor to a greenhouse gas, or an aerosol from the atmosphere.
                - generic [ref=e1716]:
                  - term
                  - definition [ref=e1717]: A location where carbon is stored. This can be via physical barriers (such as geological formations) or through partitioning based on chemical or biological processes (such as mineralization or photosynthesis).
                - generic [ref=e1718]:
                  - term
                  - definition [ref=e1719]: A set of data describing pre-intervention or control conditions to be used as a reference scenario for comparison.
                - generic [ref=e1720]:
                  - term
                  - definition [ref=e1721]: An assessment of what would have happened in the absence of a particular intervention – i.e., assuming the Baseline scenario.
                - generic [ref=e1722]:
                  - term
                  - definition [ref=e1723]: The period of time over which a Project Design Document is valid, and over which Removals or Reductions may be Verified, resulting in Issued Credits.
                - generic [ref=e1724]:
                  - term
                  - definition [ref=e1725]: Standard physical constants as well as standard values set forth by bodies such as the National Institute of Standards and Technology (NIST) or others.
                - generic [ref=e1726]:
                  - term
                  - definition [ref=e1727]: A measurement which correlates with but is not a direct measurement of the variable of interest.
                - generic [ref=e1728]:
                  - term
                  - definition [ref=e1729]: A source that would be widely considered trustworthy based on the process undertaken (e.g., peer review) or origin of the information (e.g., government body).
                - generic [ref=e1730]:
                  - term
                  - definition [ref=e1731]: The escape of CO₂ to the atmosphere after it has been stored, and after a Certificate has been Issued. A Reversal is classified as avoidable if a Project Proponent has influence or control over it and it likely could have been averted through application of reasonable risk mitigation measures. Any other Reversals will be classified as unavoidable.
                - generic [ref=e1732]:
                  - term
                  - definition [ref=e1733]: A period of time, specified by a Protocol or Module, which Projects may select to use as a Project Durability Threshold. Where a Protocol or Module does not explicitly specify a Durability Threshold, the default Durability Threshold for the Protocol or Module is 1,000 years.
                - generic [ref=e1734]:
                  - term
                  - definition [ref=e1735]: The period of time specified by a Project in its Project Design Document, which the Project must demonstrate Durability in excess of, and which the Durability of all Credits issued from a Project is equal to.
                - generic [ref=e1736]:
                  - term
                  - definition [ref=e1737]: The document, written by a Project Proponent, which records key characteristics of a Project and which forms the basis for Project Validation and evaluation in accordance with the relevant Certified Protocol. (Also known as “PDD”).
                - generic [ref=e1738]:
                  - term
                  - definition [ref=e1739]: Issuance of Credits prior to the carbon removal or GHG reduction taking place. Isometric does not Deliver Credits in this manner.
                - generic [ref=e1740]:
                  - term
                  - definition [ref=e1741]: A mathematical approach for estimating the possible outcomes of an uncertain event through repeated random sampling. It can also be referred to as a "multiple probability simulation".
                - generic [ref=e1742]:
                  - term
                  - definition [ref=e1743]: A worldwide federation (NGO) of national standards bodies from more than 160 countries, one from each member country.
                - generic [ref=e1744]:
                  - term
                  - definition [ref=e1745]: The date on which Isometric approves the initial Validation Report for a Project, following which the Project will be listed as Validated on the Registry. (Also known as “Registration Date”).
                - generic [ref=e1746]:
                  - term
                  - definition [ref=e1747]: An acceptable difference between reported Removals/emissions or Reductions/emissions and what an auditor determines is the actual Removal/emissions or Reduction/emissions.
                - generic [ref=e1748]:
                  - term
                  - definition [ref=e1749]: The act of confirming the final ownership of a given Credit and permanent withdrawal from circulation. The Counterfactual of this act is the ultimate owner of the tonne of Removal or Reduction and the sole claimant as to its attributes for the purpose of carbon accounting.
                - generic [ref=e1750]:
                  - term
                  - definition [ref=e1751]: Issuance of Credits after removal or reduction took place. This is the manner in which Isometric Delivers Credits.
                - generic [ref=e1752]:
                  - term
                  - definition [ref=e1753]:
                    - text: The permanent annulling of a Certificate to compensate for erroneous over-issuance or a Reversal. Once Canceled, the certificate will no longer be available for Delivery or Retirement
                    - insertion [ref=e1754]: .
                - generic [ref=e1755]:
                  - term
                  - definition [ref=e1756]:
                    - insertion [ref=e1757]: The calendar year in which the underlying carbon removal or climate impact associated with a Certificate occurred, as determined by the end date of the relevant removal or reduction. This will commonly, but not necessarily, correspond to the year of Certificate issuance, as issuance may occur at a later date due to reporting or verification timelines. Where a method supports granular reporting data, or growth or process modelling, across a multi-year reporting period, Certificates may be split across multiple vintage years to reflect the calendar year in which each portion of removal or climate impact occurred. Where removals or climate impact cannot be robustly attributed to individual calendar years, the vintage is assigned based on the end date of that reporting period
                    - text: .
                - generic [ref=e1758]:
                  - term
                  - definition [ref=e1759]: A function of the Isometric Registry that allows either Buyers or Project Proponents to receive Issued Credits, either by way of direct Credit Issuance in the case of Project Proponents, or by way of a Credit Transfer in the case of a Buyer.
                - generic [ref=e1760]:
                  - term
                  - definition [ref=e1761]: The document that clearly outlines how a Project will generate rigorously quantifiable Additional high-quality Removals or Reductions.
                - generic [ref=e1762]:
                  - term
                  - definition [ref=e1763]: An analysis of how much different components in a Model contribute to the overall Uncertainty.
            - generic [ref=e1764]:
              - heading "8.0 Appendix A. Types of uncertainties" [level=2] [ref=e1765]
              - paragraph [ref=e1766]:
                - text: Calculation of Uncertainty should follow documented best practices, such as the requirements of the
                - emphasis [ref=e1767]: Joint Committee for Guides in Metrology (JCGM) JCGM100:2008 - Evaluation of measurement data — Guide to the expression of uncertainty in measurement (GUM)
                - superscript [ref=e1768]:
                  - link "19" [ref=e1769] [cursor=pointer]:
                    - /url: "#user-content-fn-iso-gum"
                - text: ". Uncertainty can be assessed using two different methods:"
              - list [ref=e1770]:
                - listitem [ref=e1771]:
                  - strong [ref=e1772]: Type A
                  - text: Uncertainty, where Uncertainty is assessed by making repeated observations of the parameter of interest
                - listitem [ref=e1773]:
                  - strong [ref=e1774]: Type B
                  - text: Uncertainty, where Uncertainty is founded on
                  - emphasis [ref=e1775]: a priori
                  - text: distributions, evaluated by scientific judgment based on all of the available information on the possible variability of the parameter of interest
              - paragraph [ref=e1776]: Type B Uncertainties may frequently be encountered, since it is not always practical to make repeated measurements for every input parameter, and many input parameters are published values or estimated through other means.
            - generic [ref=e1777]:
              - heading "8.1 Emission factor uncertainty" [level=3] [ref=e1778]
              - paragraph [ref=e1779]:
                - text: Emission factors utilized should provide an Uncertainty value associated with the specific factor. Some databases from which emission factors are derived include and report the Uncertainty within the database
                - superscript [ref=e1780]:
                  - link "21" [ref=e1781] [cursor=pointer]:
                    - /url: "#user-content-fn-3"
                - text: . The factor used, its source, and the value of the Uncertainty reported and used, should be documented. For emission factors for which no Uncertainty information is provided, clearly document this and refer to
                - link "Unknown Uncertainties" [ref=e1782] [cursor=pointer]:
                  - /url: "#unknown-uncertainties"
                - text: .
            - generic [ref=e1783]:
              - heading "8.2 Measured parameter uncertainty" [level=3] [ref=e1784]
              - paragraph [ref=e1785]:
                - text: See the
                - emphasis [ref=e1786]: GUM
                - text: for details on calculation of parameter or measurement Uncertainty. For instance, measurement parameter Uncertainty estimates could be derived from manufacturers specifications or calibration records. If repeated measurements are taken, the type A uncertainty should be reported as the standard deviation. Uncertainties should be documented and reported for each measured parameter.
            - generic [ref=e1787]:
              - heading "8.3 Laboratory analysis uncertainty" [level=3] [ref=e1788]
              - paragraph [ref=e1789]: For laboratory analyses, Uncertainty may be reported based on laboratory quality assurance documentation, including laboratory calibration results and records which use a reference calibration standard that is traceable to a national standard.
              - paragraph [ref=e1790]: For a reported value based on multiple laboratory analyses, for which the value is reported as a mean, the type A uncertainty is calculated based on the standard deviation of the value around the mean.
            - generic [ref=e1791]:
              - heading "8.4 Unknown uncertainties" [level=3] [ref=e1792]
              - paragraph [ref=e1793]:
                - text: When published Uncertainty information is not available and calculation via direct measurement is not feasible, estimation of Uncertainty should follow documented best practices, such as guidance from the
                - emphasis [ref=e1794]: GUM
                - text: for evaluating type B Uncertainty. The specific approaches taken should be clearly documented.
              - paragraph [ref=e1795]: Specifically regarding emission factors, the default values for basic Uncertainty from Section 10.1 of Ecoinvent’s Overview and Methodology document may be used. Ecoinvent’s protocol assumes a lognormal distribution for a value and then uses a Pedigree Matrix to assign uncertainties based on data quality.
            - generic [ref=e1796]:
              - heading "8.5 Conservative estimate examples" [level=3] [ref=e1797]
              - paragraph [ref=e1798]: "Here are a couple of examples on how Option A (conservative estimate of input parameters) can be applied. These examples are for illustration purposes only:"
              - paragraph [ref=e1799]:
                - strong [ref=e1800]: "Example 1: Uncertainty in Truck transportation carbon intensity"
              - paragraph [ref=e1801]:
                - text: There are only a few carbon intensity factors published in a reputable emissions factor database for truck transportation. The factors range from 0.2 kg/km/t to 1.2 kg/km/t depending on different vehicle types, and the Project Proponent doesn’t know exactly what type of vehicle is used. In this case, a higher carbon intensity leads to less net CO
                - subscript [ref=e1802]: "2"
                - text: e Removal or Reduction and there are only a few relevant emissions factors to choose from so a distribution is not assumed. The project must take the conservative estimate to be the maximum value of 1.2 kg/km/t.
              - paragraph [ref=e1803]:
                - strong [ref=e1804]: "Example 2: Uncertainty in ocean DIC retention"
              - paragraph [ref=e1805]:
                - text: For enhanced weathering in agriculture, a downstream loss term in the Removal calculation that cannot be directly measured is the percentage of bicarbonate ions from weathering that is retained as dissolved inorganic carbon (DIC) upon reaching the ocean. A Project Proponent uses a regional ocean model to determine that the DIC retention fraction follows a normal distribution, with a mean of 0.90 and a standard deviation of 0.02. A lower DIC retention fraction results in less net CO
                - subscript [ref=e1806]: "2"
                - text: e Removal, so the conservative estimate is taken to be 1 standard deviation below the mean (corresponding to the 16th percentile). The conservative estimate of the DIC retention index is thus 0.88.
            - generic [ref=e1807]:
              - 'heading "9.0 Appendix B: Stepwise process for uncertainty assessment" [level=2] [ref=e1808]'
              - paragraph [ref=e1809]: This appendix provides the detailed stepwise process for reducing and documenting uncertainty. The stepwise process must be completed alongside GHG Statements submitted for verification. Projects must demonstrate how they plan to reduce and document uncertainty as part of validation.
              - paragraph [ref=e1810]:
                - strong [ref=e1811]: Step 1 - Input parameters information
              - paragraph [ref=e1812]: Protocols must report a list of all parameters that are used in the Removal or Reduction calculations. Where uncertainty data is available from external sources, such as for emission factors or relating to equipment calibration, or where uncertainty information is determined from project measurements, this must be reported.
              - paragraph [ref=e1813]:
                - strong [ref=e1814]: Step 2 - Contribution analysis
              - paragraph [ref=e1815]: Separately, a Contribution Analysis should be undertaken that demonstrates the impact of each GHG SSR on the final net Removal or Reduction. This analysis should calculate the contribution of each GHG SSR by expressing the emissions associated with that SSR during the Reporting Period as a percentage of the total net removals for the same period.
              - generic [ref=e1816]:
                - text: "[G-9MK5-1, Parameters may be omitted from a full uncertainty analysis if a sensitivity analysis can demonstrate that the parameter contributes to <1% change in removal or reduction.]"
                - paragraph [ref=e1817]: Input parameters may be omitted from step 3 if the contribution analysis can demonstrate that the individual GHG SSR contributes to < 1% of net CO₂e Removal or Reduction and that all omitted GHG SSRs collectively contribute to < 1% of net CO₂e Removal or Reduction. For all other GHG SSRs, a Sensitivity Analysis (An analysis of how much different components in a Model contribute to the overall Uncertainty.) is required.
                - text: "[/G-9MK5-1]"
              - paragraph [ref=e1818]:
                - strong [ref=e1819]: Step 3 - Sensitivity analysis
              - paragraph [ref=e1820]: A sensitivity analysis must be conducted to evaluate the impact of uncertainty in each input parameter on the final net CO₂e removal or reduction. The method used must be clearly documented so results can be independently reproduced.
              - paragraph [ref=e1821]: Where one input parameter contributes to multiple GHG SSRs, this must be treated as one input parameter.
              - paragraph [ref=e1822]: The purpose of the sensitivity analysis is to determine how uncertainty in an individual input parameter affects the net CO₂e removal or reduction estimate. This is done by adjusting the parameter using an appropriate uncertainty factor and recalculating the net CO₂e removal or reduction while keeping all other parameters constant.
              - paragraph [ref=e1823]: "If the resulting change in net CO₂e removal or reduction is less than 1%, no further action is required. If the change is equal to, or exceeds 1%, the adjusted value must be used in the GHG Statement. An exception to this rule is allowable for input parameters where data has been adopted to calculate GHG emissions and, the Project Proponent can demonstrate that:"
              - list [ref=e1824]:
                - listitem [ref=e1825]: The input parameter is based on accurate, verifiable primary data, or
                - listitem [ref=e1826]: The value used is conservative.
              - paragraph [ref=e1827]: Any such justification must be clearly documented and supported by evidence.
              - paragraph [ref=e1828]: "When dealing with uncertainty, Project Proponents must follow the hierarchy outlined below to determine uncertainty factors:"
              - list [ref=e1829]:
                - listitem [ref=e1830]: Some Protocols contain specific guidance on assessing uncertainty in parameters. Project Proponents must first consult the relevant protocol for any explicit rules on uncertainty estimation.
                - listitem [ref=e1831]: If no specific rules are included on uncertainty estimation in the relevant Protocol, then Project Proponents must follow the general guidance outlined below to assess uncertainty.
                - listitem [ref=e1832]: For input parameters based on primary data from direct measurements, the uncertainty factor must be derived using appropriate statistical methods to directly calculate the standard deviation of the parameter. These methods provide a systematic approach to quantifying uncertainty in the final net CO₂e removal or reduction estimate.
              - paragraph [ref=e1833]: "For parameters not based on primary data, the uncertainty factor may be informed by:"
              - list [ref=e1834]:
                - listitem [ref=e1835]: Third-party data, such as meter accuracy from manufacturers or uncertainty ranges published with emission factors (e.g., in databases like Ecoinvent);
                - listitem [ref=e1836]: Context-specific considerations, such as variability in logistics, seasonal effects, or operational practices;
                - listitem [ref=e1837]: A default value of ±20%, only when no better information is available and with justification for its use.
              - paragraph [ref=e1838]:
                - text: All uncertainty factors must be clearly referenced, and the basis for their selection must be documented. Acceptable sources include instrument calibration data, published literature, expert judgment, proxies, and other reputable references. Additional guidance on assessing different types of uncertainties is provided in
                - link "Appendix A" [ref=e1839] [cursor=pointer]:
                  - /url: "#appendix-a-types-of-uncertainties"
                - text: .
              - paragraph [ref=e1840]: "The Sensitivity analysis must be repeated when any of the following conditions are met:"
              - list [ref=e1841]:
                - listitem [ref=e1842]: The previous assessment was conducted one year or more prior to the current verification;
                - listitem [ref=e1843]: There has been a significant change in the Net Removal or Reduction estimate;
                - listitem [ref=e1844]: There has been a change in activities associated with any of the relevant SSRs.
            - generic [ref=e1845]:
              - 'heading "10.0 Appendix C: Risk of Reversal Questionnaire" [level=2] [ref=e1846]'
              - paragraph [ref=e1847]: This questionnaire provides guidance on assessing Risk of Reversal, to be used by Protocols and Projects which need to make this assessment for use on the Isometric Registry.
              - paragraph [ref=e1848]: This risk assessment identifies relevant material risk factors at the level of the Isometric Standard. The relevant risk factors from this Standard-level risk assessment are also specified at the Protocol level. Each relevant risk factor identified as part of a risk assessment must be included in the monitoring plan for a Project, and published as part of the Project Design Document (The document, written by a Project Proponent, which records key characteristics of a Project and which forms the basis for Project Validation and evaluation in accordance with the relevant Certified Protocol. (Also known as “PDD”).).
              - paragraph [ref=e1849]: The duration of required monitoring is determined in the relevant Protocol or Module. As above, the risk assessment informs the design of the monitoring plan requirements and consequently the extent, frequency and duration of monitoring.
              - paragraph [ref=e1850]: "Projects must re-assess their reversal risk using this questionnaire at the renewal of each crediting period, or sooner if:"
              - list [ref=e1851]:
                - listitem [ref=e1852]: the relevant Protocol requires a more frequent assessment,
                - listitem [ref=e1853]: monitoring identifies a reversal-related risk,
                - listitem [ref=e1854]: the Project storage technology materially changes,
                - listitem [ref=e1855]: an actual reversal event takes place.
              - paragraph [ref=e1856]: If the relevant Protocol specifies that Reversals are not directly observable (i.e., the storage is an open system), the Project's Risk of Reversal is automatically "No observable risk." Such Projects do not need to complete this questionnaire, but must still maintain a monitoring plan in accordance with the requirements of the relevant Protocol. Where a Protocol does not specify this, Projects must complete the Risk of Reversal questionnaire.
              - paragraph [ref=e1857]:
                - text: Please see the
                - link "Reversals and Buffer Pools" [ref=e1858] [cursor=pointer]:
                  - /url: "#reversals-and-buffer-pools"
                - text: for more details on how Risk of Reversal is used.
              - table [ref=e1859]:
