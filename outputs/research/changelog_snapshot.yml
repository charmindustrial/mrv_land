              - paragraph [ref=e1471]: Isometric ensures the protection of natural or legal persons who report infringements or lodge complaints in good faith in accordance with the Whistleblower Protection Directive (EU) 2019/1937 of the European Parliament and of the Council.
              - paragraph [ref=e1472]: Isometric will maintain a register of all complaints made which relate to Projects issued under the CRCF. Upon request from a Member State or the Commission, Isometric will share all documents related to the complaint and its handling.
              - paragraph [ref=e1473]:
                - text: As standard, Isometric will pursue the approach to remediation described in Isometric’s CRCF
                - deletion [ref=e1474]: compliance
