                  - text: ) that can serve as guidance on how Risk of Reversal is determined.
                - text: "[/G-EP06-1]"
              - paragraph [ref=e575]: The answers to the Protocol or Module specific risk assessment, or the default risk questionnaire, are used to support the Risk of Reversal and Buffer Pool Size.
              - paragraph [ref=e576]:
                - text: The Risk of Reversal and the corresponding Buffer Pool Size are meant to compensate for the risk of Reversals that may be observed as a result of monitoring. The Buffer Pool is not meant to compensate for reversals of greenhouse gasses that are stored in an open system (e.g., the ocean) and direct observation of reversals would not be possible. In open systems, storage risks must be assessed as part of the Uncertainty assessment and accounted for in the Conservative estimate of Removal or Reduction. As such, Protocols that store carbon in open systems typically fall into the “No observable risk” Risk of Reversal category, and correspondingly are not required to make buffer pool contributions, or to complete a reversal risk questionnaire. This also applies to Reductions with a permanent emission impact. See
                - link "Buffer Pools" [ref=e577] [cursor=pointer]:
                  - /url: "#buffer-pools"
                - text: for further information.
            - generic [ref=e578]:
