              - paragraph [ref=e866]: Project Proponents must demonstrate Regulatory Additionality, meaning that the Project is not required by existing laws, regulations, policies, or other binding obligations. If the activity is required by such legal requirements, the Project is not considered Additional.
              - generic [ref=e867]:
                - text: "[G-2PR2-0, In the case of UNFCCC non-Annex I countries, projects must only demonstrate that the project is not required by any systematically enforced existing laws, regulations, policies, or other binding obligations. If relevant laws or regulations exist but are not systematically enforced, projects must provide evidence to demonstrate this lack of enforcement.]"
