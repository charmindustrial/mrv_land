                    - listitem [ref=e812]: Significant changes in circumstances, which affect the implementation of the Project activity, in comparison to similar activities.
                - listitem [ref=e813]: Calculate the cumulative market penetration rate (as a percentage) of the Project activity within the population who have not received carbon finance revenue (e.g., where activities are neither part of a registered Isometric Project, nor registered under other GHG programs), in the sample of adopters.
                - listitem [ref=e814]: If the market penetration rate is below 20%, the activity is considered to demonstrate Common Practice additionality.
            - generic [ref=e815]:
              - heading "3.5.1.2 (ii) Method for assessing Common Practice for discrete facilities" [level=5] [ref=e816]
              - list [ref=e817]:
                - listitem [ref=e818]: Assess the extent to which similar activities to the proposed Project activity have been implemented previously or are currently underway in the applicable geographic area. Similar activities are those with comparable technologies or practices, scales, and regulatory environments.
                - listitem [ref=e819]: "Exclude activities which are under validation or registered under the Isometric Standard; activities under other GHG programs may optionally be excluded. Record [math: N_{all}] as the total remaining number of similar projects or activities."
                - listitem [ref=e820]:
                  - text: "Where similar activities to the proposed Project activity are identified, compare the Project activity to these other activities. Identify and explain any essential distinctions between the proposed Project and similar activities. Essential distinctions may be related to, for example:"
                  - list [ref=e821]:
                    - listitem [ref=e822]: Differences in laws, regulations or policies;
                    - listitem [ref=e823]: Geological or climatic differences;
                    - listitem [ref=e824]: Economic or socioeconomic conditions;
                    - listitem [ref=e825]: Market conditions or access to resources;
                    - listitem [ref=e826]: Availability and accessibility of infrastructure;
                    - listitem [ref=e827]: Labor force and expertise;
                    - listitem [ref=e828]: Significant changes in circumstances, which affect the implementation of the project activity, in comparison to similar activities.
                - listitem [ref=e829]:
                  - text: "Identify the following parameters, and assess Common Practice additionality, as follows:"
                  - list [ref=e830]:
                    - listitem [ref=e831]: "[math: N_{all}], defined as the total number of similar projects in the applicable geographic area."
                    - listitem [ref=e832]: "[math: N_{diff}], defined as those projects which have essential distinctions from the proposed Project."
                    - listitem [ref=e833]: "Calculate the “Common Practice factor” [math: F = 1 – (N_{diff} / N_{all})], which represents the share of similar projects without essential distinction in the applicable geographic area."
                    - listitem [ref=e834]:
                      - text: "The proposed Project activity is considered to demonstrate Common Practice additionality where:"
                      - list [ref=e835]:
                        - listitem [ref=e836]: "[math: N_{all}] is less than or equal to 3;"
                        - listitem [ref=e837]: "Or, [math: F] is below or equal to 20%."
            - generic [ref=e838]:
              - heading "3.5.2 Financial Additionality Considerations" [level=4] [ref=e839]
              - paragraph [ref=e840]:
                - text: As per the above requirements in
                - link "Additionality" [ref=e841] [cursor=pointer]:
                  - /url: "#additionality"
                - text: ", the requirements of this section are only relevant where Removals or Reductions are not the main purpose and the only source of revenue of a Project."
              - generic [ref=e842]:
                - text: "[G-CDNX-1, In order to demonstrate economic barriers would prevent the project implementation in the absence of carbon finance, projects must provide full Project financials, calculate return on investment via internal rate of return (IRR) and a scenario analysis to demonstrate the ability to meet Additionality criteria for cases where values in the analysis change.]"
                - paragraph [ref=e843]: In such a case, evidence of Financial Additionality must be provided via full Project financials.
                - paragraph [ref=e844]: Proof of Financial Additionality requires, at minimum, the calculation of the return on investment via calculation of the Internal Rate of Return (IRR) for the Project.
                - text: "[/G-CDNX-1]"
              - paragraph [ref=e845]: The IRR determination must be completed in accordance with generally-accepted accounting practices. Furthermore, the assumptions, data and conclusions of the analysis must be consistent with information presented to the company’s decision-making management and investors/lenders. The analysis should be completed for a 10-year period, or if another length of time is chosen, justification must be given based on project circumstances. Non-depreciated residual values of any equipment or assets must be included as positive cash flows in the final year.
              - generic [ref=e846]:
                - text: "[G-02HJ-1, Projects must briefly describe any government subsidies, public financing or tax incentives received and take these into account as a revenue stream.]"
                - paragraph [ref=e847]: Existing government subsidies, public financing or tax incentives received must be taken into account as a revenue stream.
                - text: "[/G-02HJ-1]"
              - paragraph [ref=e848]: "The Project Proponent must determine the IRR for the Project without Carbon Finance revenues. For new Projects, the Project must ultimately demonstrate:"
              - list [ref=e849]:
                - listitem [ref=e850]: a zero or negative IRR; or
                - listitem [ref=e851]: an IRR of less than the cost of capital (required rate of return) or return on equity for the Project.
              - paragraph [ref=e852]: A Project may justify a higher IRR as additional if the Project Proponent can demonstrate that the Project requires such an IRR to enable financing for higher risk Projects, which may require higher interest rate loans, high interest rate venture or equity investment, or similar.
              - paragraph [ref=e853]: The Project must demonstrate that the economic performance of the mitigation activity increases decisively through carbon credit revenues, and that carbon credit revenues can raise the economic performance at or above the required financial benchmark (IRR).
              - paragraph [ref=e854]: "The IRR analysis must also include a scenario analysis that demonstrates the ability to meet the above Additionality criteria for cases where values in the analysis change. Scenario analyses must include:"
              - list [ref=e855]:
                - listitem [ref=e856]: variation of initial investment costs, if greater than 20% of total Project costs;
                - listitem [ref=e857]: variation of projected revenues to consider market changes for products or fees charged;
                - listitem [ref=e858]: evaluation of any assumption, value, or projection that accounts for greater than 20% of Project costs or Project revenues, or any value that impacts less than 20% of costs or revenues but which the Project Proponent determines can have significant impact (>10%) on IRR.
              - paragraph [ref=e859]: At a minimum, the IRR analysis must include variation of the factors above by ±20% or by a more appropriate value based on historical data or literature.
              - paragraph [ref=e860]: "For pre-existing Projects:"
              - list [ref=e861]:
                - listitem [ref=e862]: Projects must also provide an estimate of the quantity of Removals and/or Reductions that would occur in the absence of Carbon Finance.
                - listitem [ref=e863]: Removals and/or Reductions only in excess of this quantity may be considered Financially Additional.
            - generic [ref=e864]:
