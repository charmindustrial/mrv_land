                - listitem [ref=e1536]: EN 15259 Air quality — Measurement of stationary source emissions — Requirements for measurement sections and sites and for the measurement objective, plan and report;
                - listitem [ref=e1537]: ISO 16911-2 Stationary source emissions — Manual and automatic determination of velocity and volume flow rate in ducts.
              - paragraph [ref=e1538]: "Laboratories conducting analysis on behalf of the Project must be ISO 17025 accredited unless the Project Proponent can demonstrate this is not technically feasible or would incur unreasonable costs. The Project Proponent must demonstrate any non-accredited laboratory meets the requirements of ISO 17025 through ISO 9001 accreditation, other certified Quality Management System, or otherwise submit a PDD Appendix containing the following evidence for the laboratory:"
              - list [ref=e1539]:
