            - generic [ref=e900]:
              - heading "3.7.1 Conservative Estimate of Removals and Reductions" [level=4] [ref=e901]
              - generic [ref=e902]:
                - text: "[R-K6MA-0, Projects must specify whether they used conservative estimates of input parameters, variance propagation and/or Monte Carlo simulations in consideration of uncertainty (one or multiple options).]"
                - paragraph [ref=e903]: Projects must follow a procedure for incorporating Uncertainties into a Conservative estimate of Removal or Reduction. The following approaches are acceptable, and other methods may be considered after an internal Isometric review.
                - text: "[/R-K6MA-0]"
              - paragraph [ref=e904]: A. Conservative estimate of input parameters
              - paragraph [ref=e905]: B. Variance propagation
              - paragraph [ref=e906]: C. Monte Carlo Simulations (A mathematical approach for estimating the possible outcomes of an uncertain event through repeated random sampling. It can also be referred to as a "multiple probability simulation".)
              - paragraph [ref=e907]: Option A is suitable for Projects where it is difficult to obtain detailed information on input parameter distributions. Using conservative estimates of input parameters will lead to a Conservative Removal or Reduction estimate.
              - paragraph [ref=e908]: Option B can be used when parameters follow normal distributions and errors are linear (i.e., errors increase linearly as parameter values increase) and independent (i.e., changing one variable has no effect on another variable).
              - paragraph [ref=e909]: Option C provides a more comprehensive representation of Uncertainties and may result in more Credits Issued. This approach is suitable for Projects where sufficient information is available for all input variables so that Monte Carlo Simulations can be conducted.
              - paragraph [ref=e910]: As Removal and Reduction quantifications become better-constrained and more data is gathered, Protocols may progress from using Option A to Option B to Option C.
            - generic [ref=e911]:
              - heading "3.7.2 Guidance on Conservative Estimate of Input Parameters" [level=4] [ref=e912]
              - paragraph [ref=e913]:
                - text: For Option A, a uniform distribution is assumed for all parameters, unless it can be demonstrated otherwise. Isometric recommends that the value used in the Removal or Reduction calculation be either ≤16
                - superscript [ref=e914]: th
                - text: or ≥84
                - superscript [ref=e915]: th
                - text: percentile, depending on which one yields a more Conservative estimate of Removal or Reduction. There may be instances where a parameter might only have a few reported values, and it does not make sense to assume a continuous distribution. In these cases, it would be more appropriate to use the minimum or maximum value as the Conservative estimate. See
                - link "Appendix A" [ref=e916] [cursor=pointer]:
                  - /url: "#appendix-a-types-of-uncertainties"
                - text: for some examples.
            - generic [ref=e917]:
              - heading "3.7.3 Guidance on Variance Propagation" [level=4] [ref=e918]
              - paragraph [ref=e919]:
                - text: For Option B, the variance must be defined for all input parameters. Variance propagation should be conducted following uncertainty propagation rules
                - superscript [ref=e920]:
                  - link "8" [ref=e921] [cursor=pointer]:
                    - /url: "#user-content-fn-uncertainty-propagation-rules"
                - text: ", where the outcome is the variance in the Removal or Reduction. Isometric recommends that the Conservative Removal or Reduction estimate be at least 1 standard deviation (square-root of the variance) below the mean, equivalent to ≤16"
                - superscript [ref=e922]: th
                - text: percentile.
            - generic [ref=e923]:
              - heading "3.7.4 Guidance on Monte Carlo Simulations" [level=4] [ref=e924]
              - paragraph [ref=e925]:
                - text: For Option C, the input distributions must be specified for all input parameters. The final distribution for the Removal or Reduction is determined by randomly sampling from input distributions many times (e.g., n = 1,000).
                - superscript [ref=e926]:
                  - link "9" [ref=e927] [cursor=pointer]:
                    - /url: "#user-content-fn-monte-carlo"
                - text: The Conservative estimate of Removal or Reduction will be ≤16
                - superscript [ref=e928]: th
                - text: percentile for consistency between Option B and C in the case of normal distributions.
