                - text: For a Project to be evaluated for the Isometric Registry, the Project Proponent must document Project characteristics in a Project Design Document (The document, written by a Project Proponent, which records key characteristics of a Project and which forms the basis for Project Validation and evaluation in accordance with the relevant Certified Protocol. (Also known as “PDD”).) (PDD). The document will form the basis for
                - link "Project Validation" [ref=e606] [cursor=pointer]:
                  - /url: "#validation-and-verification-process"
                - text: and evaluation in accordance with the relevant Certified Protocol. The PDD must be consistent with ISO 14064-2:2019
                - superscript [ref=e607]:
