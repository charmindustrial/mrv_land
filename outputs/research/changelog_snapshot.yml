                - text: .
            - generic [ref=e520]:
              - heading "2.5.6 Uncertainty Accounting" [level=4] [ref=e521]
              - paragraph [ref=e522]: Uncertainty is due to factors such as inability to precisely measure certain physical phenomena and/or assumptions in Models or GHG accounting. Protocols must set up frameworks that allow for the reduction of uncertainties with time as measurements, models, and scientific understanding improves.
            - generic [ref=e523]:
              - heading "2.5.7 Durability" [level=4] [ref=e524]
              - paragraph [ref=e525]: Emission impacts can have a Risk of Reversal (The escape of CO₂ to the atmosphere after it has been stored, and after a Certificate has been Issued. A Reversal is classified as avoidable if a Project Proponent has influence or control over it and it likely could have been averted through application of reasonable risk mitigation measures. Any other Reversals will be classified as unavoidable.) and a finite durability associated with them. Alternatively, some Reductions are permanent with no risk of reversal, for example when a high GWP gas is permanently converted to a low GWP gas.
              - paragraph [ref=e526]: Protocols and Modules will specify if an emission impact has a risk of reversal and finite durability with one or more Durability Threshold (A period of time, specified by a Protocol or Module, which Projects may select to use as a Project Durability Threshold. Where a Protocol or Module does not explicitly specify a Durability Threshold, the default Durability Threshold for the Protocol or Module is 1,000 years.)(s), or in the case of some Reductions if it is permanent. Where a Protocol or Module does not explicitly specify a Durability Threshold (A period of time, specified by a Protocol or Module, which Projects may select to use as a Project Durability Threshold. Where a Protocol or Module does not explicitly specify a Durability Threshold, the default Durability Threshold for the Protocol or Module is 1,000 years.) or that the emission impact is permanent, the default Durability Threshold (A period of time, specified by a Protocol or Module, which Projects may select to use as a Project Durability Threshold. Where a Protocol or Module does not explicitly specify a Durability Threshold, the default Durability Threshold for the Protocol or Module is 1,000 years.) for the Protocol or Module is 1,000 years.
              - generic [ref=e527]:
                - text: "[R-7C8E-1, Projects crediting non-permanent emission impacts must select from the durability threshold(s) defined in the protocol or module to be the project durability threshold.]"
                - paragraph [ref=e528]: Projects following a Protocol or Module crediting non-permanent emission impacts must select from the Durability Threshold (A period of time, specified by a Protocol or Module, which Projects may select to use as a Project Durability Threshold. Where a Protocol or Module does not explicitly specify a Durability Threshold, the default Durability Threshold for the Protocol or Module is 1,000 years.)(s) defined in the Protocol or Module to be the Project Durability Threshold (The period of time specified by a Project in its Project Design Document, which the Project must demonstrate Durability in excess of, and which the Durability of all Credits issued from a Project is equal to.), by specifying this in the Project’s PDD.
                - text: "[/R-7C8E-1]"
              - generic [ref=e529]:
                - text: "[R-1T2Y-1, Projects crediting non-permanent emission impacts must demonstrate a durability in excess of the designated project durability threshold.]"
                - paragraph [ref=e530]: Projects crediting non-permanent emission impacts must demonstrate a Durability in excess of the designated Project Durability Threshold (The period of time specified by a Project in its Project Design Document, which the Project must demonstrate Durability in excess of, and which the Durability of all Credits issued from a Project is equal to.).
                - text: "[/R-1T2Y-1]"
              - paragraph [ref=e531]: Removals or Reductions will only be Credited for their impact in excess of the specified Project Durability Threshold (The period of time specified by a Project in its Project Design Document, which the Project must demonstrate Durability in excess of, and which the Durability of all Credits issued from a Project is equal to.).
              - paragraph [ref=e532]: Where Projects generating Removals or Reductions cause additional storage or reduction below the Project Durability Threshold (The period of time specified by a Project in its Project Design Document, which the Project must demonstrate Durability in excess of, and which the Durability of all Credits issued from a Project is equal to.) for the Project, this storage or reduction cannot count positively towards the end number of Credits, but can be used to offset losses in Counterfactual storage or reduction below the Project Durability Threshold (The period of time specified by a Project in its Project Design Document, which the Project must demonstrate Durability in excess of, and which the Durability of all Credits issued from a Project is equal to.), as outlined in the relevant Certified Protocol.
