                - text: "[/G-6VGD-0]"
            - generic [ref=e513]:
              - heading "2.5.5 Common Calculation Factors" [level=4] [ref=e514]
              - paragraph [ref=e515]: "All calculations must use consistent, standardized factors, including the following:"
              - paragraph [ref=e516]:
                - strong [ref=e517]: Global Warming Potential (GWP)
                - text: ": Unless otherwise stated in a Protocol or Module, calculations must use the 100-yr GWP for the GHG of interest, based on the most recent volume of the IPCC Assessment Report, currently the Sixth Assessment Report"
                - superscript [ref=e518]:
                  - link "2" [ref=e519] [cursor=pointer]:
