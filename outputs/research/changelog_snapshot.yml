                  - text: .
                - listitem [ref=e1462]: The Project Proponent (or its legal predecessor) failed a Verification under another scheme, unless said audit occurred more than 3 years prior to the current application or the previous certification scheme has ceased operations.
                - listitem [ref=e1463]: The Project Proponent (or its legal predecessor) withdrew from another scheme prior to the first Verification, unless the Project Proponent can demonstrate the withdrawal was unavoidable and not caused by a Critical or Major Non-Conformity.
              - paragraph [ref=e1464]:
                - insertion [ref=e1465]: Isometric will ensure an efficient and timely exchange of information as it relates to the prevention of scheme hopping with other certification schemes. Where required, Isometric will ensure an efficient and timely exchange of audit information between Isometric and other authorised certification schemes to support the effective preparation and conduct of the audit.
            - generic [ref=e1466]:
