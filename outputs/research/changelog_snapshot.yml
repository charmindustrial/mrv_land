                - listitem [ref=e1531]: where components of the measuring systems cannot be calibrated, identify these in the Monitoring Plan and propose alternative control activities.
                - listitem [ref=e1532]: when the equipment is found not to comply with required performance, the Project Proponent must promptly take necessary corrective action.
              - paragraph [ref=e1533]: "All measurements shall be conducted with calibrated measurement equipment according to industry standards including, where applicable:"
              - list [ref=e1534]:
