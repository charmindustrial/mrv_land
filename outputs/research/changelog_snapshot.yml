            - generic [ref=e1950]:
              - heading [level=3] [ref=e1951]:
                - insertion [ref=e1952]: 10.1 Risk Score Categories
              - paragraph [ref=e1953]: Where Reversals are not directly observable (as specified in the relevant Protocol), a Project’s Risk of Reversal is automatically deemed “No observable risk”, and no buffer contributions are required.
              - paragraph [ref=e1954]: "For other Projects, Risk of Reversal is determined based on the score of the risk assessment questionnaire, as follows:"
              - list [ref=e1955]:
                - listitem [ref=e1956]: "0: Very Low Risk Level (1% buffer)"
                - listitem [ref=e1957]: "1-2: Low Risk Level (5% buffer)"
                - listitem [ref=e1958]: "3-4: Medium Risk Level (7% buffer)"
                - listitem [ref=e1959]: "5+: High Risk Level (10-20% buffer)"
            - generic [ref=e1960]:
              - heading [level=3] [ref=e1961]:
                - text: "10."
                - deletion [ref=e1962]: "1"
                - insertion [ref=e1963]: "2"
                - text: Worked examples
              - paragraph [ref=e1964]:
                - text: Isometric's Uncertainty and Buffer Pool policies represent two mostly non-overlapping approaches for how Isometric plans to be conservative in how credits are quantified and to potentially insure against future events that may result in a Reversal. Specifically, in removal pathways that utilize large, open-system reservoirs (e.g., the ocean) where direct observation of a reversal is not feasible, Isometric's Uncertainty policy will generally result in a larger uncertainty discount
                - superscript [ref=e1965]:
                  - link "22" [ref=e1966] [cursor=pointer]:
                    - /url: "#user-content-fn-uncertainty-discount"
                - text: ", and Isometric's Buffer Pool policy will generally result in a smaller Buffer Pool Size, or no Buffer Pool contribution. Conversely, in removal pathways that utilize closed-system reservoirs that are more straightforward to monitor, Isometric's Uncertainty policy will generally result in a smaller uncertainty discount, but the activity will be subject to a larger Buffer Pool Size. Below are two example scenarios that illustrate how and when these two policies are invoked."
              - paragraph [ref=e1967]:
                - strong [ref=e1968]: "Example 1: Ocean Alkalinity Enhancement"
              - paragraph [ref=e1969]:
                - text: An OAE Project Proponent releases a known amount of alkalinity into the ocean. In accordance with the Protocol and PDD, the Project Proponent uses a model to estimate that the median CO
                - subscript [ref=e1970]: "2"
                - text: uptake after a certain amount of time is 100 tonnes. In accordance with Isometric's Uncertainty policy, the Project Proponent reports that the 16th percentile of CO
                - subscript [ref=e1971]: "2"
