                - text: "[/G-1T3C-0]"
              - paragraph [ref=e990]: It is the responsibility of the Project to ensure that any EIA or SIA undertaken meets all local, regional and national and international regulations and laws.
            - generic [ref=e991]:
              - heading "3.10.1 Environmental Impacts" [level=4] [ref=e992]
              - paragraph [ref=e993]: Assessments undertaken to evaluate the potential for environmental harm by a Project may be undertaken with varying formats, names and costs, depending on the location of a Project. These assessments are commonly named environmental impact assessments (EIA) and are often required under specific environmental laws or regulations. Within some countries, such as the U.S., multiple levels or types of EIA may exist. Within the U.S. EIAs exist as Environmental Impact Statements (EIS) and Environmental Assessments (EA), with requirements for each type of assessment varying on a federal and state by state basis. It is the responsibility of the Project Proponent to identify specific requirements for EIAs within the location and type of a Project. Within this Standard all such assessments are referred to as Environmental Impact Assessments (EIA).
              - generic [ref=e994]:
