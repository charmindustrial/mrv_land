              - paragraph [ref=e1477]:
                - insertion [ref=e1478]: If Member States have reasonable doubts about the ability of a specific certification body to carry out its audit work, they may share that information with the other Member States, the Commission and the certification scheme. Isometric will immediately investigate and inform the Member States and the Commission of the outcome and any corrective actions
            - generic [ref=e1479]:
              - heading "6.4 Remediation for Fraud" [level=3] [ref=e1480]
              - paragraph [ref=e1481]: In cases where CRCF certificates have been issued on the basis of fraudulent information, the associated Credit Account of the Project Proponent will be suspended and any necessary compensation will be provided through cancellation of certified units.
              - paragraph [ref=e1482]: The Project Proponent must procure an equivalent number of CRCF units and immediately cancel them within 90 days of notification. If the Project Proponent fails to do this, as a last resort Isometric will procure a corresponding number of CRCF certificates and cancel them.
            - generic [ref=e1483]:
              - heading "6.5 Internal Monitoring" [level=3] [ref=e1484]
              - paragraph [ref=e1485]: Isometric will implement a system of internal monitoring to verify compliance of Project Proponents with the rules and procedures applied by this Standard and to ensure the quality of the work carried out by the auditors of the Certification Bodies.
              - paragraph [ref=e1486]: Internal monitoring will be carried out at least once a year or at least at the same frequency of the audits to reflect the certification scope, as well as the level of risk of the activities carried out by the Project Proponents.
              - paragraph [ref=e1487]: As part of the internal monitoring, Isometric will require Certification Bodies to provide all reports of the Validation (certification audit), Verification (re-certification audit), or monitoring audit. The internal monitoring will cover a random and risk-based sample of those audit reports by each Certification Body.
            - generic [ref=e1488]:
