                - listitem [ref=e1453]: depending on the specific types of activity audited, have additional experience as relevant in the fields of agriculture, agronomy, ecology, forestry, natural science, silviculture, engineering, building materials and embodied carbon, energy management or a related field;
              - paragraph [ref=e1454]: Verification reports issued must include all information listed in Annex III of the Commission Implementing Regulation.
              - paragraph [ref=e1455]: Isometric will run training courses for VVBs. This will include an exam which tests an auditor's (verifier's) overall technical expertise in the area. Auditors must participate in the training courses before performing audits for Isometric. Isometric will also provide guidance to VVBs on other relevant aspects of CRCF certification, including updates on the regulatory framework or findings from Isometric's internal monitoring process.
            - generic [ref=e1456]:
              - heading "6.2 Exclusion Criteria" [level=3] [ref=e1457]
              - paragraph [ref=e1458]: "For Projects seeking eligibility under CRCF, Isometric will exclude a Project from this Standard in the following circumstances:"
              - list [ref=e1459]:
                - listitem [ref=e1460]:
                  - text: The Project Proponent (or its legal predecessor) failed to disclose the relevant information required under
