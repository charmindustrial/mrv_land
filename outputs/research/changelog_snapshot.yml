              - heading "1.0 Introduction" [level=2] [ref=e240]
              - paragraph [ref=e241]:
                - text: The Isometric Registry (A database that holds information on Verified Removals and Reductions, and reviewed EACs, based on Protocols. Registries Issue Certificates, and track their ownership and Retirement.) records Verified Credits (A publicly visible uniquely identifiable Credit Certificate Issued by a Registry that gives the owner of the Credit the right to account for one net metric tonne of Verified CO₂e Removal or Reduction. In the case of this Standard, the net tonne of CO₂e Removal or Reduction comes from a Project Validated against a Certified Protocol.) that represent emission impacts which satisfy the latest
                - link "Version" [ref=e242] [cursor=pointer]:
                  - /url: "#versioning"
                - text: of the Isometric Standard. This includes net Removals (The term used to represent the CO₂ taken out of the atmosphere as a result of a CDR process.) of atmospheric carbon dioxide equivalent (CO
                - subscript [ref=e243]: "2"
                - text: e) and Reductions (The term used to represent the reduction of greenhouse gasses emitted into the atmosphere from an existing emitter as a result of an emission reduction process.) of specified greenhouse gas emissions. The Isometric Standard, detailed in this document, lists the requirements that ensure Delivered (The outcome of a Project Proponent providing Credits to fulfill Buyers' purchases.) Credits have measurable climate impact. In summary, Credits must represent a Removal or Reduction, be Additional (An evaluation of the likelihood that an intervention causes a climate benefit above and beyond what would have happened in a no-intervention Baseline scenario.) and be calculated using the latest scientific techniques. This includes a scientifically robust Uncertainty (A lack of knowledge of the exact amount of CO₂ removed by a particular process, Uncertainty may be quantified using probability distributions, confidence intervals, or variance estimates.) quantification meeting at minimum with the requirements outlined in the Standard.
              - paragraph [ref=e244]: Isometric coordinates quantification and Verification (A process for evaluating and confirming the net Removals and Reductions for a Project, using data and information collected from the Project and assessing conformity with the criteria set forth in the Isometric Standard and the Protocol by which it is governed. Verification must be completed by an Isometric approved third-party (VVB).) necessary to Issue (Certificates are issued to the Certificate Account of a Project Proponent with whom Isometric has a Validated Protocol after an Order for Verification and Certificate Issuance services from a Buyer and once a Verified Removal or Reduction has taken place.) Credits on the Isometric Registry. All data, calculations and evidence associated with Credits are publicly available.
              - paragraph [ref=e245]: This Isometric Standard sets out the duties and obligations of stakeholders in relation to the Isometric Registry. Its purpose is also to provide for a consistent and predictable experience for all parties engaging with the Isometric Registry.
              - paragraph [ref=e246]: This Standard and the rules contained herein were designed and developed by Isometric HQ Limited.
            - generic [ref=e247]:
              - heading "1.1 Language guide" [level=3] [ref=e248]
              - paragraph [ref=e249]: "Throughout this Standard, and throughout Isometric Protocols, the words below are to be interpreted as follows:"
              - list [ref=e250]:
                - listitem [ref=e251]: “Must” indicates a requirement.
                - listitem [ref=e252]: “Should” indicates a recommendation.
                - listitem [ref=e253]: “May” indicates a permissible course of action.
                - listitem [ref=e254]: “Will” indicates standard operating procedures implemented by Isometric.
            - heading "1.2 Purpose and Principles" [level=3] [ref=e256]
            - generic [ref=e257]:
              - heading "1.2.1 Purpose" [level=4] [ref=e258]
              - paragraph [ref=e259]: "The Isometric Crediting Program (The scope of Isometric which involves all of the processes relevant to the entire life cycle of a Credit.) is guided by the Isometric Standard, and exists to:"
              - list [ref=e260]:
                - listitem [ref=e261]:
                  - text: provide guidance, transparent infrastructure and to set a high scientific caliber that fosters high quality climate action in the form of durable net Removals of CO
                  - subscript [ref=e262]: "2"
                  - text: e and Reductions of greenhouse gas emissions; and
                - listitem [ref=e263]: Issue Verified Credits that can be used as an evidentiary statement of their ownership for Removal or Reduction claims and reporting purposes.
              - paragraph [ref=e264]: The Isometric Standard sets requirements that all Isometric Protocols must meet at a minimum.
            - generic [ref=e265]:
              - heading "1.2.2 Principles" [level=4] [ref=e266]
              - paragraph [ref=e267]: "The Isometric Crediting Program adheres to the following principles:"
              - paragraph [ref=e268]:
                - strong [ref=e269]: Collaboration
              - list [ref=e270]:
                - listitem [ref=e271]: Isometric engages with relevant governmental and Non-Governmental Organizations (NGOs) (A nonprofit, usually with a societal, scientific, or political purpose; by definition an NGO is not associated with a governmental entity.) to facilitate equitable representation of stakeholders (Any person or entity who can potentially affect or be affected by Isometric or an individual Project activity.) in a predominantly private industry and advance the creation of high quality industry standards.
                - listitem [ref=e272]: Isometric engages the scientific community and collaborates with experts in areas such as sensor development, physical inspection, auditing, earth-system modeling and data analysis to Verify Deliveries.
                - listitem [ref=e273]: Where appropriate and practicable, Isometric Systems (Isometric's proprietary code and processes that create/contain intellectual property (IP) and enable the Registry to function smoothly.) may be integrated with similar tracking systems to help ensure full and accurate information for Buyers of Removals and Reductions and minimize the potential for Double Counting (Improperly allocating the same Removal or Reduction from a Project Proponent more than once to multiple Buyers.).
              - paragraph [ref=e274]:
                - strong [ref=e275]: Incentive Alignment
              - list [ref=e276]:
                - listitem [ref=e277]: Isometric does not sell or broker the sale of credits.
                - listitem [ref=e278]: Isometric charges Buyers – not Project Proponents (The organization that develops and/or has overall legal ownership or control of a Removal or Reduction Project.) – a single flat fee per Offtake (A contract in which a Buyer agrees to purchase a set Removal and/or Reduction at a set price.) or purchase which is based on effort required for monitoring, reporting, and verification of a specific pathway/process. This price structure is independent from the number of Credits issued and thus reduces incentives for overcrediting.
                - listitem [ref=e279]: Isometric collects fees from Buyers on a payment schedule decoupled from the credit delivery schedule. This mechanism eliminates incentives for early crediting.
                - listitem [ref=e280]: Isometric does not receive payments from Project Proponents to Verify the delivery of tonnes and adherence to Certified (The Isometric process which involves expert review and Public Consultation in order to arrive at an approved version of a Protocol, against which Projects will be Validated and Removals or Reductions will be Verified.)Protocols (A document that describes how to quantitatively assess the net amount of CO₂ removed by a process. To Isometric, a Protocol is specific to a Project Proponent's process and comprised of Modules representing the Carbon Fluxes involved in the CDR process. A Protocol measures the full carbon impact of a process against the Baseline of it not occurring.).
                - listitem [ref=e281]:
                  - text: Isometric undertakes the cost of Protocol development and
                  - link "third-party Verification" [ref=e282] [cursor=pointer]:
                    - /url: "#validation-and-verification-process"
                  - text: to ensure neither Buyers nor Project Proponents can have undue influence over this process.
                - listitem [ref=e283]:
                  - text: Isometric
                  - link "independently and impartially" [ref=e284] [cursor=pointer]:
                    - /url: "#validation-and-verification-body-qualification-requirements"
                  - text: chooses third-party Validation and Verification Bodies (VVBs) (Third-party auditing organizations that are experts in their sector and used to determine if a project conforms to the rules, regulations, and standards set out by a governing body. A VVB must be approved by Isometric prior to conducting validation and verification.) for Projects (An activity or process or group of activities or processes that alter the condition of a Baseline and leads to Removals or Reductions.).
              - paragraph [ref=e285]:
                - strong [ref=e286]: Scientific Rigor
              - list [ref=e287]:
                - listitem [ref=e288]: Isometric uses the latest science to quantify net Removal or Reduction, Durability, Uncertainty and Additionality across a variety of heterogeneous Removal and Reduction Pathways.
                - listitem [ref=e289]: Isometric will review and update Protocols without a penalty on previously Issued Credits in order to incentivize continued investigation of underlying scientific questions – through which Removal or Reduction estimates can be further constrained.
                - listitem [ref=e290]: Isometric quantifies all Carbon Fluxes (The amount of carbon exchanged between two or more Reservoirs over a period of time.) and Greenhouse Gasses (Those gaseous constituents of the atmosphere, both natural and anthropogenic (human-caused), that absorb and emit radiation at specific wavelengths within the spectrum of terrestrial radiation emitted by the Earth’s surface, by the atmosphere itself, and by clouds. This property causes the greenhouse effect, whereby heat is trapped in Earth’s atmosphere (CDR Primer, 2022).) related to the Removal or Reduction activity taken by the Project Proponent in a Conservative (Purposefully erring on the side of caution under conditions of Uncertainty by choosing input parameter values that will result in a lower net CO₂ Removal or GHG Reduction than if using the median input values. This is done to increase the likelihood that a given Removal or Reduction calculation is an underestimation rather than an overestimation.) manner that incorporates uncertainty – including second order effects on leakage (The increase in GHG emissions outside the geographic or temporal boundary of a project that results from that project's activities.).
              - paragraph [ref=e291]:
                - strong [ref=e292]: Transparency
              - list [ref=e293]:
                - listitem [ref=e294]:
                  - text: Isometric provides Buyers and Beneficiaries (The organization benefiting from the Removal or Reduction claim afforded by a Certificate. This may be the current holder of the Certificate at the time of Retirement, or an organization specified by the Certificate account holder during the Retirement procedure.) with access to full traceability of Carbon Fluxes involved in the quantification of Removals or Reductions, alongside the evidence gathered for the
                  - link "Validation and Verification Process" [ref=e295] [cursor=pointer]:
                    - /url: "#validation-and-verification-process"
                  - text: . For Reductions, gross reduction is reported in CO
                  - subscript [ref=e296]: "2"
                  - text: e and broken down into avoided fossil CO
                  - subscript [ref=e297]: "2"
                  - text: and avoided non-CO
                  - subscript [ref=e298]: "2"
                  - text: greenhouse gasses.
                - listitem [ref=e299]: Protocols and quantification Models (A calculation, series of calculations or simulations that use input variables in order to generate values for variables of interest that are not directly measured.) are transparently versioned, allowing for public tracking of changes, and public consultation after major updates.
                - listitem [ref=e300]: Each Credit Issued by Isometric is publicly accessible – allowing for inspection of the information used to quantify Removals or Reductions.
            - heading "1.3 Scope" [level=3] [ref=e302]
            - generic [ref=e303]:
              - heading "1.3.1 Project Type" [level=4] [ref=e304]
              - paragraph [ref=e305]:
                - text: Isometric works with Projects conforming to a Protocol which has undergone or will undergo the
                - link "Isometric Certification Process" [ref=e306] [cursor=pointer]:
                  - /url: "#protocol-certification-process"
                - text: ". Projects are not eligible if:"
              - list [ref=e307]:
                - listitem [ref=e308]: They do not meet the conditions to justify the minimum Durability set out in the applicable Protocol or Module, or
                - listitem [ref=e309]: Project activities lead to Enhanced Hydrocarbon Recovery (EHR).
            - generic [ref=e310]:
              - heading "1.3.2 Credit Type" [level=4] [ref=e311]
              - paragraph [ref=e312]: "Isometric Issues two Types of Credits:"
              - list [ref=e313]:
                - listitem [ref=e314]: Carbon Dioxide Removal credits, for the net removal or one metric tonne of CO₂e, and
                - listitem [ref=e315]: Emission Reduction credits, for the net reduction of one metric tonne of CO₂e of specified greenhouse gasses generated by an existing emitter.
              - paragraph [ref=e316]: Projects can issue multiple Types of credit.
            - generic [ref=e317]:
              - heading "1.3.3 Geographic Scope" [level=4] [ref=e318]
              - paragraph [ref=e319]: Isometric works with Projects worldwide. Isometric works in English. Additional languages may be considered given translation by a trusted source.
              - paragraph [ref=e320]: In some instances, Modules (Independent components of Isometric Certified Protocols which are transferable between and applicable to different Protocols.) within Protocols may be tailored for Projects which have geographical specificities. In this circumstance, geography-specific alterations to utilized Modules will be made clear in order to maintain transparency amongst Project Proponents.
            - generic [ref=e321]:
              - heading "1.3.4 Greenhouse Gas (GHG) Eligibility" [level=4] [ref=e322]
              - paragraph [ref=e323]: "Isometric issues Removal and Reduction credits. The following greenhouse gasses (GHGs) are relevant:"
              - list [ref=e324]:
                - listitem [ref=e325]: For Carbon Dioxide Removal credits, the removal of atmospheric CO₂,
                - listitem [ref=e326]: For Emission Reduction credits, reductions of specified greenhouse gasses generated by an existing greenhouse gas emitting source or activity, as defined in the relevant Protocol.
              - paragraph [ref=e327]:
                - text: In evaluating the comprehensive greenhouse gas (GHG) emissions of a Project, all GHGs are considered. Isometric uses the United States Environmental Protection Agency definition of GHGs
                - superscript [ref=e328]:
                  - link "1" [ref=e329] [cursor=pointer]:
                    - /url: "#user-content-fn-ghg"
                - text: ", which includes: carbon dioxide (CO₂), methane (CH"
                - subscript [ref=e330]: "4"
                - text: ), nitrous oxide (N
                - subscript [ref=e331]: "2"
                - text: O), and fluorinated gases such as hydrofluorocarbons (HFCs), perfluorocarbons (PFCs), sulfur hexafluoride (SF
                - subscript [ref=e332]: "6"
                - text: ), and nitrogen trifluoride (NF
                - subscript [ref=e333]: "3"
                - text: ).
            - generic [ref=e334]:
              - heading "1.4 Versioning" [level=3] [ref=e335]
              - paragraph [ref=e336]: This Isometric Standard was first published 4th October 2023.
              - paragraph [ref=e337]: This document will be updated on an ongoing basis to reflect changes in the operation, governance and/or rules that apply to either Projects on, or activity described by, the Registry.
              - paragraph [ref=e338]: Any proposed material changes to the Standard will be put forward for review by the independent Science Network. Following any amendments resulting from that process, the draft changes will be put out for public comment. After having incorporated any further amendments, the final changes will be published in an updated version of the Standard, alongside a clear explanation of the stakeholder input received and how this informed the final changes that were made.
              - paragraph [ref=e339]: Version numbers follow the MAJOR.MINOR.PATCH format, where three non-negative integers denote the version of the Standard.
              - paragraph [ref=e340]: "Incrementing each number signifies a different type and magnitude of change:"
              - list [ref=e341]:
                - listitem [ref=e342]:
                  - strong [ref=e343]: Major
                  - text: – Material changes significantly altering the scope, applicability, or foundational framework of the Standard.
                - listitem [ref=e344]:
                  - strong [ref=e345]: Minor
                  - text: – Material changes that may have significant impact on Project eligibility, Verification practices, or Credit issuance.
                - listitem [ref=e346]:
                  - strong [ref=e347]: Patch
                  - text: – Improvements without introducing material changes, such as fixing typographic errors, clarifying wording, or adding examples.
              - paragraph [ref=e348]: A full changelog, along with all previously published versions and their dates of publication, is publicly available on Isometric’s website.
            - generic [ref=e349]:
              - heading "1.4.1 Standard version adoption" [level=4] [ref=e350]
              - paragraph [ref=e351]:
                - text: New versions of the Standard follow the same adoption requirements as the ones outlined for the Protocol version adoption in
                - link "Section 2.4.5" [ref=e352] [cursor=pointer]:
                  - /url: "#protocol-adoption-requirements"
                - text: .
