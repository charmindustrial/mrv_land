            - generic [ref=e1523]:
              - heading "6.7.1 Global Warming Potential of non-CO2 GHGs" [level=4] [ref=e1524]
              - paragraph [ref=e1525]: All Isometric CRCF Projects must convert emissions of non-CO2 GHGs to CO2e using the 100-year Global Warming Potentials set out in Annex I to the Delegated Regulation (EU) 2020/1044.
            - generic [ref=e1526]:
