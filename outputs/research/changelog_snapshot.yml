              - heading "1.5 Citation" [level=3] [ref=e354]
              - paragraph [ref=e355]: The appropriate citation for the document is the Isometric Standard (2026), version 2.0.
            - generic [ref=e356]:
              - heading "2.0 Protocol Requirements" [level=2] [ref=e357]
              - paragraph [ref=e358]: This section outlines the requirements for all Isometric Certified Protocols including Isometric Certified Modules.
            - generic [ref=e359]:
              - heading "2.1 Protocol Certification Process" [level=3] [ref=e360]
              - generic [ref=e361]:
                - text: "[R-NK7R-0, Projects must provide a brief explanation for why they are eligible under the selected protocol.]"
                - paragraph [ref=e362]: All Projects must be Validated (A systematic and independent process for evaluating the reasonableness of the assumptions, limitations and methods that support a Project and assessing whether the Project conforms to the criteria set forth in the Isometric Standard and the Protocol by which the Project is governed. Validation must be completed by an Isometric approved third-party (VVB).) against, and Removals (The term used to represent the CO₂ taken out of the atmosphere as a result of a CDR process.) and Reductions (The term used to represent the reduction of greenhouse gasses emitted into the atmosphere from an existing emitter as a result of an emission reduction process.) Verified against, an Isometric Certified Protocol.
                - text: "[/R-NK7R-0]"
              - paragraph [ref=e363]:
                - text: An Isometric Certified Protocol is a Protocol developed by Isometric that has undergone
                - link "Public Consultation" [ref=e364] [cursor=pointer]:
                  - /url: "#consultation-requirements"
                - text: ", and is listed as Certified on the Isometric Registry. Protocols may incorporate Modules, using the"
                - link "Isometric Modular Framework" [ref=e365] [cursor=pointer]:
                  - /url: "#modular-framework"
                - text: .
              - paragraph [ref=e366]: Isometric will not list multiple Protocols or Modules as Certified where they pertain to the same or essentially the same underlying carbon removal activities.
            - generic [ref=e367]:
              - heading "2.2 Modular Framework" [level=3] [ref=e368]
              - paragraph [ref=e369]: A Protocol can incorporate an existing Isometric Certified Module. Modules are developed by Isometric and follow the same Certification process.
              - paragraph [ref=e370]: Each Protocol minor version specifies and locks in the exact minor versions of all Modules which it incorporates. Once certified, this combination never changes, so the Protocol minor version number alone specifies which Module versions apply.
              - paragraph [ref=e371]: All Protocols will incorporate the same Modules for GHG accounting, in order to create a consistent accounting framework across all Projects.
              - paragraph [ref=e372]:
                - text: Isometric will review individual Modules annually and be responsible for version changes in accordance with our
                - link "Updates to Protocols" [ref=e373] [cursor=pointer]:
                  - /url: "#updates-to-protocols"
                - text: policy.
            - generic [ref=e374]:
              - heading "2.3 Consultation Requirements" [level=3] [ref=e375]
              - paragraph [ref=e376]: "The external Consultation process will be as follows:"
              - list [ref=e377]:
                - listitem [ref=e378]: Expert review through the Isometric Science Network (The Isometric group aimed at bringing together scientists working in industry, academia, NGOs and more to promote more efficient collaboration across the CDR ecosystem.)
                - listitem [ref=e379]: Public Consultation (The process by which a Protocol or Module is made available to the public for comment on the Isometric Registry.)
              - paragraph [ref=e380]: Expert review will be conducted through the Isometric Science Network. Expert review is the process in which the internal Isometric Science Team invites individuals with deep subject matter expertise to submit feedback on a Protocol or Module. Isometric generously compensates experts for their detailed review with a flat hourly fee paid upon feedback submission.
              - paragraph [ref=e381]: Public Consultation will be announced on the Isometric Registry and to the Isometric Science Network. Protocols and Modules are open for public commenting for a minimum of 30 days. All relevant stakeholder (Any person or entity who can potentially affect or be affected by Isometric or an individual Project activity.) comments are considered and responded to by the internal Isometric Science Team, and the results of the Consultation will be published on the Registry. All anonymized comments and reviews will be made available upon request.
              - paragraph [ref=e382]: Typically, at least 5-10 scientific experts are engaged for a given Module or Protocol via the combination of the above processes.
              - paragraph [ref=e383]: When a Protocol is updated and the changes to it are limited to introducing, upgrading, or removing Modules that have already undergone Consultation, the Module Consultations fulfill the Protocol Consultation requirement. A Module Consultation must address the impact of the Module on any Protocol that will incorporate it.
            - heading "2.4 Updates to Protocols" [level=3] [ref=e385]
            - generic [ref=e386]:
              - heading "2.4.1 Protocol update schedule" [level=4] [ref=e387]
              - paragraph [ref=e388]:
                - text: The internal Isometric Science Team will review a Protocol or Module if Isometric deems it necessary due to material changes in realms such as scientific knowledge, technology and/or regulatory frameworks. This review will be completed within a period of 6 months from the date an issue is raised. If the review results in substantial changes to a Protocol or Module such that a new version is required, these changes will adhere to the
                - link "Protocol Certification process" [ref=e389] [cursor=pointer]:
                  - /url: "#protocol-certification-process"
                - text: .
              - paragraph [ref=e390]: "In addition to the triggers for review outlined above, each Protocol will be reviewed at the sooner of the following criteria:"
              - list [ref=e391]:
                - listitem [ref=e392]: after 2 years have passed since the original Certification; or
                - listitem [ref=e393]: "whenever the number of Credits Issued (Certificates are issued to the Certificate Account of a Project Proponent with whom Isometric has a Validated Protocol after an Order for Verification and Certificate Issuance services from a Buyer and once a Verified Removal or Reduction has taken place.) under a Protocol passes the following milestones: 100,000 Credits Issued; 500,000 Credits Issued; 1,000,000 Credits Issued; 5,000,000 Credits Issued."
              - paragraph [ref=e394]:
                - text: Major and minor changes will be documented on the Isometric Registry and published alongside the results of a public commenting period of a minimum duration of 30 days. All versions of Protocols and Modules will be documented, archived and made publicly available. All revisions and updates will be systematically versioned according to the
                - link "Protocol version number" [ref=e395] [cursor=pointer]:
                  - /url: "#protocol-version-number"
                - text: format.
              - paragraph [ref=e396]: Isometric reserves the right to suspend and/or withdraw a Protocol if deemed necessary due to credible, evidence-based concerns that carbon removal activities are being overestimated or that Additionality may not be ensured. In such exceptional cases, Isometric may take immediate action to suspend and/or withdraw a Protocol. The Protocol may then be re-introduced following the usual period of public consultation in the case of any material change.
            - generic [ref=e397]:
              - heading "2.4.2 Impact of Protocol updates on Projects and Credits" [level=4] [ref=e398]
              - paragraph [ref=e399]:
                - text: Credits issued against a previous Protocol version are not affected by Protocol updates, unless otherwise specified with justification in the updated Protocol. Projects must update to newer Protocol versions according to
                - link "Protocol adoption requirements" [ref=e400] [cursor=pointer]:
                  - /url: "#protocol-adoption-requirements"
                - text: ", with continuity of operations protected by"
                - link "Protocol backward compatibility mechanisms" [ref=e401] [cursor=pointer]:
                  - /url: "#protocol-backward-compatibility-mechanisms"
                - text: .
            - generic [ref=e402]:
              - heading "2.4.3 Protocol update materiality" [level=4] [ref=e403]
              - paragraph [ref=e404]: For the purposes of Protocol versioning, material changes are defined as those which affect how Validations and Verifications are conducted, or their outcomes. If a change requires Validation and Verification Bodies to modify their approach, methods, or decisions, it is considered material.
            - generic [ref=e405]:
              - heading "2.4.4 Protocol version number" [level=4] [ref=e406]
              - paragraph [ref=e407]:
                - text: Version numbers follow the
                - code [ref=e408]: "`MAJOR.MINOR.PATCH`"
                - text: "format, where three non-negative integers denote the version of the Protocol or Module. Incrementing each number signifies a different type and magnitude of change:"
              - list [ref=e409]:
                - listitem [ref=e410]:
                  - strong [ref=e411]: Major
                  - text: – A significant departure from a previous version, introducing material changes to validation and verification rules. Typically used to remove support for old practices.
                - listitem [ref=e412]:
                  - strong [ref=e413]: Minor
                  - text: – An evolution from a previous version, introducing material changes to validation and verification rules. Typically used to introduce support for new practices, adapt to scientific or legal developments, or systematize existing rules.
                - listitem [ref=e414]:
                  - strong [ref=e415]: Patch
                  - text: – An improvement without introducing material changes. For example – fixing typographic errors, clarifying wording, or adding examples.
              - paragraph [ref=e416]: A full changelog for each Protocol, along with all previously published versions and their dates of publication, is publicly available on Isometric's website.
            - generic [ref=e417]:
              - heading "2.4.5 Protocol adoption requirements" [level=4] [ref=e418]
              - paragraph [ref=e419]: New Projects must validate against the most recent certified major and minor version of the relevant Protocol. Projects may qualify for an earlier version by commencing Validation or initiating Project registration on the Registry prior to the new version's certification. Isometric may also, at its discretion, permit a Project Proponent to validate a Project against an earlier Protocol version in other scenarios; for example if the most recent version has not been approved by ICVCM or CORSIA.
              - paragraph [ref=e420]: "The adoption requirements upon release of a new Protocol version are as follows:"
              - list [ref=e421]:
                - listitem [ref=e422]:
                  - strong [ref=e423]: Major
                  - text: – Projects are not required to adopt a new major version until they seek renewal of their Crediting Period.
                - listitem [ref=e424]:
                  - strong [ref=e425]: Minor
                  - text: "– Same as Major: Projects are not required to adopt a new minor version until they seek renewal of their Crediting Period."
                - listitem [ref=e426]:
                  - strong [ref=e427]: Patch
                  - text: – Take effect automatically upon release. Projects operate under the latest patch version of their current Protocol minor version.
              - paragraph [ref=e428]: Isometric reserves the right to issue a mandatory adoption schedule in exceptional circumstances in order to resolve a substantive vulnerability, or due to material changes in realms such as scientific knowledge, technology and/or regulatory frameworks.
            - generic [ref=e429]:
              - heading "2.4.6 Protocol backward compatibility mechanisms" [level=4] [ref=e430]
              - paragraph [ref=e431]: "When new Protocol versions are Certified, Projects can continue operating uninterrupted through the use of the following backward compatibility mechanisms:"
              - list [ref=e432]:
                - listitem [ref=e433]:
                  - strong [ref=e434]: No forced major and minor version upgrades
                  - text: – Projects are not required to adopt a new Protocol major or minor version until they seek renewal of their Crediting Period, or an exceptional mandatory adoption schedule was issued.
                - listitem [ref=e435]:
                  - strong [ref=e436]: Legacy exemptions
                  - text: – Project Proponents may voluntarily adopt a new version and request exemptions against new requirements introduced after the Protocol minor version used for initial Validation in the current Crediting Period. Where a Project Proponent seeks such an exemption against specific requirements, the Project Proponent must demonstrate that said requirements create non-trivial operational difficulty or cost. Where granted, such exemptions remain valid until the end of the current Crediting Period.
                - listitem [ref=e437]:
                  - strong [ref=e438]: Retained validation status
                  - text: – Projects do not require revalidation when adopting a new Protocol minor version.
            - heading "2.5 Protocol Contents" [level=3] [ref=e440]
            - generic [ref=e441]:
              - heading "2.5.1 Applicability" [level=4] [ref=e442]
              - paragraph [ref=e443]: All Protocols must include an Applicability section.
              - paragraph [ref=e444]: The Applicability section must, at a minimum, outline the activities to which the Protocol applies and whether Removal credits, Reduction credits, or both are generated from applicable Projects.
              - paragraph [ref=e445]: The Applicability section may also set out conditions that a project must meet in order to be eligible for crediting under the Protocol, including specific baseline requirements.
            - generic [ref=e446]:
              - heading "2.5.2 Boundaries" [level=4] [ref=e447]
              - generic [ref=e448]:
                - text: "[R-2VKW-1, Projects must define their system boundary to include all sources, sinks, and reservoirs (SSRs) and their associated GHGs as specified in the relevant protocol. Any GHG SSR that is excluded from the system boundary must be clearly identified and supported by robust justification and evidence where applicable.]"
                - paragraph [ref=e449]: Protocols require Cradle-to-Grave (Considering impacts at each stage of a product's life cycle, from the time natural resources are extracted from the ground and processed through each subsequent stage of manufacturing, transportation, product use, and ultimately, disposal.) GHG accounting of all emissions associated with a Project's Removal and/or Reduction process.
                - text: "[/R-2VKW-1]"
              - generic [ref=e450]:
                - text: "[R-TGBM-0, Projects must provide a detailed description of the GHG statement approach and methodology in relation to calculations.]"
                - paragraph [ref=e451]: The GHG emissions that result from the Project's activities within the defined boundary, combined with any Leakages (The increase in GHG emissions outside the geographic or temporal boundary of a project that results from that project's activities.) must together encompass the entire impact of a Project on GHG emissions. This must be presented as part of a GHG Statement (A document submitted alongside Claimed Removals and/or Reductions that details the calculations associated with a Removal or Reduction, including the Project's emissions, Removals, Reductions and Leakages, presented together in net metric tonnes of CO₂e per Removal or Reduction.) and corresponding GHG Statement Report (Document submitted alongside a GHG Statement to provide supporting information and justification.).
                - text: "[/R-TGBM-0]"
              - generic [ref=e452]:
                - text: "[R-VHWJ-0, Projects must define the temporal and geographic project boundary.]"
                - paragraph [ref=e453]: All Projects must have a defined temporal and geographic project boundary (The defined temporal and geographical boundary of a Project.).
                - text: "[/R-VHWJ-0]"
              - paragraph [ref=e454]: "The system boundary (GHG sources, sinks and reservoirs (SSRs) associated with the project boundary and included in the GHG Statement.) for GHG accounting sets out the GHG Sources (Any process or activity that releases a greenhouse gas, an aerosol, or a precursor of a greenhouse gas into the atmosphere.), Sinks (Any process, activity, or mechanism that removes a greenhouse gas, a precursor to a greenhouse gas, or an aerosol from the atmosphere.), and Reservoirs (A location where carbon is stored. This can be via physical barriers (such as geological formations) or through partitioning based on chemical or biological processes (such as mineralization or photosynthesis).) associated with the project boundary and to be considered in the GHG Statement. The system boundary is specified by the relevant Protocol and must include at a minimum all GHG SSRs from:"
              - generic [ref=e455]:
                - text: "[G-PGFZ-0, System boundaries must include the construction/manufacturing of each physical site and associated equipment.]"
                - list [ref=e456]:
                  - listitem [ref=e457]: the construction or manufacturing of each physical site and associated equipment;
                - text: "[/G-PGFZ-0]"
              - generic [ref=e458]:
                - text: "[G-A5BM-0, System boundaries must include the operation of each process.]"
                - list [ref=e459]:
                  - listitem [ref=e460]: the operation of each process; and
                - text: "[/G-A5BM-0]"
              - generic [ref=e461]:
                - text: "[G-XT79-0, System boundaries must include the closure and disposal of each site and associated equipment.]"
                - list [ref=e462]:
                  - listitem [ref=e463]: the closure and disposal of each site and associated equipment.
                - text: "[/G-XT79-0]"
            - generic [ref=e464]:
              - heading "2.5.3 Baselines" [level=4] [ref=e465]
              - generic [ref=e466]:
                - text: "[R-PGFH-1, Projects must reason and evidence the baseline scenario of their activities having not taken place. Projects will only be credited for removals or reductions above this counterfactual baseline.]"
                - paragraph [ref=e467]: All Projects must be assessed against a Baseline (A set of data describing pre-intervention or control conditions to be used as a reference scenario for comparison.) scenario of their activities not having taken place.
                - text: "[/R-PGFH-1]"
              - paragraph [ref=e468]: Establishment of the Baseline scenario will differ between Project types and will be specified in the relevant Protocol.
              - generic [ref=e469]:
                - text: "[G-HF2Y-1, Counterfactuals must be calculated using conservative assumptions and must be assessed for every removal or reduction.]"
                - paragraph [ref=e470]: "A project's Counterfactual (An assessment of what would have happened in the absence of a particular intervention – i.e., assuming the Baseline scenario.) is:"
                - list [ref=e471]:
                  - listitem [ref=e472]:
                    - text: For a Removal, a quantification of the CO
                    - subscript [ref=e473]: "2"
                    - text: removal and storage that would have taken place without the project's activities.
                  - listitem [ref=e474]: For a Reduction, a quantification of the greenhouse gas reduction specified by the relevant Protocol that would have taken place without the project's activities.
                - paragraph [ref=e475]: This must be calculated using conservative assumptions, as outlined in relevant Protocols, and must be assessed for every Removal or Reduction.
                - text: "[/G-HF2Y-1]"
              - generic [ref=e476]:
                - text: "[G-53YK-1, Project baselines must account for any existing government policies or legal requirements that lower GHG emissions.]"
                - paragraph [ref=e477]: Project Baselines must account for any existing government policies or legal requirements that lower GHG emissions.
                - text: "[/G-53YK-1]"
              - paragraph [ref=e478]: Projects will only be Credited for Removals or Reductions above and beyond what was likely to have occurred in the Baseline scenario.
              - paragraph [ref=e479]: Projects must reassess and validate the Baseline scenario whenever they request a Crediting Period (The period of time over which a Project Design Document is valid, and over which Removals or Reductions may be Verified, resulting in Issued Credits.) renewal.
            - generic [ref=e480]:
              - heading "2.5.4 Default Emission Factors, Proxies and Models" [level=4] [ref=e481]
              - generic [ref=e482]:
                - text: "[R-NZQ2-0, Projects must describe and justify any models used for quantification, monitoring, and meeting specified protocol requirements.]"
                - paragraph [ref=e483]:
                  - text: Protocols can use
                  - link "Default Emission Factors" [ref=e484] [cursor=pointer]:
                    - /url: "#default-emission-factors"
                  - text: ", Standards (Standard physical constants as well as standard values set forth by bodies such as the National Institute of Standards and Technology (NIST) or others.), Proxies (A measurement which correlates with but is not a direct measurement of the variable of interest.) and Models (A calculation, series of calculations or simulations that use input variables in order to generate values for variables of interest that are not directly measured.) to quantify Removals or Reductions, demonstrate Additionality and/or establish Baselines. In metered systems, the preference is for direct measurement of required variables."
                - paragraph [ref=e485]: Proxies and Models will only be permitted for use under circumstances which are justifiable, such as for reasons of practicality, reliability, and for gap filling in variable un-metered systems.
                - text: "[/R-NZQ2-0]"
              - paragraph [ref=e486]: This justification must be outlined in the Protocol. Proxy measurements are secondarily preferred, and models may be used when neither Proxy or direct measurements are viable.
              - generic [ref=e487]:
                - text: "[G-GYAF-0, Models and proxy measurements must apply conservative uncertainty factors and make conservative assumptions.]"
                - paragraph [ref=e488]: When used, Models and Proxy measurements must apply Conservative Uncertainty factors and make Conservative assumptions.
                - text: "[/G-GYAF-0]"
              - generic [ref=e489]:
                - text: "[G-4K64-0, Assumptions and estimations must be disclosed and justified.]"
                - paragraph [ref=e490]: Assumptions and estimations must be disclosed and justified.
                - text: "[/G-4K64-0]"
              - generic [ref=e491]:
                - text: "[G-R81S-0, Uncertainty must be assessed and clearly outlined in the protocol.]"
                - paragraph [ref=e492]: When Models and Proxy measurements are used, Uncertainty must be assessed and clearly outlined in the Protocol.
                - text: "[/G-R81S-0]"
              - paragraph [ref=e493]: Further requirements and guidance for the use of Default Emission Factors, Standards, Proxies and Models in Protocols are outlined below.
            - generic [ref=e494]:
              - heading "2.5.4.1 Default Emission Factors" [level=5] [ref=e495]
              - paragraph [ref=e496]: The Protocol must appropriately cite and describe the source of any third-party Default Emission Factor, Standard, Model or Proxy. Third-party Default Emission Factors and Standards must be either internationally recognized or derived from a Reputable Source (A source that would be widely considered trustworthy based on the process undertaken (e.g., peer review) or origin of the information (e.g., government body).).
              - paragraph [ref=e497]:
                - text: Where a newly established Default Emission Factor is used in a Protocol, the reasoning behind this choice and documentation of Default Emission Factor calculations must be clearly outlined and will be subject to review in accordance with the
                - link "Consultation Requirements" [ref=e498] [cursor=pointer]:
