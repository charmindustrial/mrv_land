            - generic [ref=e1071]:
              - heading "3.10.3 Sustainable Development Impacts" [level=4] [ref=e1072]
              - generic [ref=e1073]:
                - text: "[R-BWX0-0, Projects must demonstrate how their carbon removal activities are consistent with relevant SDGs.]"
                - paragraph [ref=e1074]: Projects must demonstrate, where relevant and feasible, how their carbon removal activities are consistent with relevant Sustainable Development Goals (SDG) objectives of all jurisdictions in which they operate.
                - text: "[/R-BWX0-0]"
              - paragraph [ref=e1075]: The SDGs are a set of 17 global and interconnected goals established by the United Nations in 2015 to address a wide range of social, economic and environmental issues.
              - paragraph [ref=e1076]: Such an explanation must be included in the Project Design Document (The document, written by a Project Proponent, which records key characteristics of a Project and which forms the basis for Project Validation and evaluation in accordance with the relevant Certified Protocol. (Also known as “PDD”).). If applicable, a qualitative assessment must be included for any positive impacts identified in relation to SDGs other than SDG13. Project Proponents must provide information on any standardized assessment tools and methods used as part of this explanation.
            - generic [ref=e1077]:
              - heading "3.11 GHG Statement Policies" [level=3] [ref=e1078]
              - paragraph [ref=e1079]: Projects credited under the Isometric Standard must use project-level consequential analysis to determine net removals or reductions associated with project activities. Projects must be assessed against a baseline scenario of the project not taking place. Attributional analysis is acceptable as a proxy for project emissions accounting.
              - paragraph [ref=e1080]: "Projects may submit Removals and Reductions in the same GHG Statement (A document submitted alongside Claimed Removals and/or Reductions that details the calculations associated with a Removal or Reduction, including the Project's emissions, Removals, Reductions and Leakages, presented together in net metric tonnes of CO₂e per Removal or Reduction.) but they must be reported separately:"
              - list [ref=e1081]:
                - listitem [ref=e1082]:
                  - text: The Project's removals, associated counterfactual and emissions allocated to removals must be presented together in net metric tonnes of CO
                  - subscript [ref=e1083]: "2"
                  - text: e.
                - listitem [ref=e1084]:
                  - text: The Project's reductions, associated counterfactual and emissions allocated to reductions must be presented together in net metric tonnes of CO
                  - subscript [ref=e1085]: "2"
                  - text: e. Gross reductions and associated counterfactuals must be subdivided into avoided fossil CO
                  - subscript [ref=e1086]: "2"
                  - text: and avoided non-CO
                  - subscript [ref=e1087]: "2"
                  - text: greenhouse gasses.
              - generic [ref=e1088]:
                - text: "[G-8K27-1, Projects must outline any assumptions and limitations of their approach, providing full transparency in terms of value-choices, rationales and expert judgements, and provide information on any tools used as part of the assessment.]"
                - paragraph [ref=e1089]: All Projects must follow GHG accounting requirements as set out by the relevant Protocol and Modules.
                - text: "[/G-8K27-1]"
              - generic [ref=e1090]:
                - text: "[G-19AX-0, Projects must provide information on all data (including activity data and emission factors) and associated sources adopted for emissions calculations for all relevant SSRs.]"
                - paragraph [ref=e1091]: This includes following GHG Statement boundaries and adhering to GHG accounting principles such as data quality and materiality.
                - text: "[/G-19AX-0]"
            - generic [ref=e1092]:
              - heading "3.12 Data sharing" [level=3] [ref=e1093]
              - paragraph [ref=e1094]: "All evidence and data related to the underlying quantification of Removals or Reductions will be available to the public through Isometric's platform for any Verified Credit. This includes:"
              - list [ref=e1095]:
                - listitem [ref=e1096]: Project Design Document (The document, written by a Project Proponent, which records key characteristics of a Project and which forms the basis for Project Validation and evaluation in accordance with the relevant Certified Protocol. (Also known as “PDD”).)
                - listitem [ref=e1097]: Measurements taken
                - listitem [ref=e1098]: Emission factors used
                - listitem [ref=e1099]: Scientific literature used
              - paragraph [ref=e1100]: The Project Proponent may request for confidential information to be restricted, whereby it will only be available to authorized Buyers, Isometric and designated VVBs (during Validation or Verification). This includes emissions factors from licensed databases. However, all other numerical data produced or used as part of the quantification of CO₂e removed or reduced may not be restricted in this way.
            - generic [ref=e1101]:
              - heading "4.0 Validation and Verification Requirements" [level=2] [ref=e1102]
              - paragraph [ref=e1103]: This section defines the requirements for Validation and Verification of Projects on the Isometric Registry. Accredited VVBs Validate Projects and Verify Removals and Reductions in line with this Isometric Standard and a Certified Protocol.
            - generic [ref=e1104]:
              - heading "4.1 Validation and Verification Body Qualification Requirements" [level=3] [ref=e1105]
              - paragraph [ref=e1106]:
                - text: All VVBs are approved by Isometric independently and impartially based on alignment with
                - link "Conflict of Interest" [ref=e1107] [cursor=pointer]:
                  - /url: "#conflicts-of-interest"
                - text: policies,
                - link "rotation of VVB" [ref=e1108] [cursor=pointer]:
                  - /url: "#rotation-of-validation-and-verification-bodies"
                - text: policies,
                - link "oversight" [ref=e1109] [cursor=pointer]:
                  - /url: "#validation-and-verification-body-oversight"
                - text: "on quality, and the following requirements:"
              - list [ref=e1110]:
                - listitem [ref=e1111]:
                  - text: "VVBs must be able to demonstrate accreditation from:"
                  - list [ref=e1112]:
                    - listitem [ref=e1113]:
                      - text: an International Accreditation Forum
                      - superscript [ref=e1114]:
                        - link "17" [ref=e1115] [cursor=pointer]:
                          - /url: "#user-content-fn-international-accreditation-forum"
                      - text: member against ISO (A worldwide federation (NGO) of national standards bodies from more than 160 countries, one from each member country.) 14065 or other relevant ISO standard, including but not limited to ISO 14034, ISO 17020, ISO 17029; or
                    - listitem [ref=e1116]: a relevant governmental or intergovernmental regulatory body.
                - listitem [ref=e1117]: Alternatively, on a case-by-case basis, if VVBs are able to demonstrate to Isometric that they satisfy all required Verification needs and competencies required for the relevant Protocol and follow the guidelines of ISO 19011 or other relevant standards, they may be approved.
            - generic [ref=e1118]:
              - heading "4.2 Validation and Verification Process" [level=3] [ref=e1119]
              - paragraph [ref=e1120]: All Projects must undergo an initial Project Validation, carried out by an independent VVB, to assess conformity with the Isometric Standard, and with the applied Certified Protocol. Once a Project has been Validated, the Project is subsequently able to submit GHG Statements to Isometric. Isometric requires Verification of any GHG Statements in order to Issue Credits. Validation and Verification will be carried out in line with ISO 14064-3 and ISO 14065. Additional requirements are listed below.
              - list [ref=e1121]:
                - listitem [ref=e1122]: Unless otherwise specified in the applicable Protocol or Module, Removals or Reductions may be Verified annually, or more frequently, according to the requirements of the relevant Certified Protocol, or at the Project Proponent's request.
                - listitem [ref=e1123]: Project Validation may occur at the same time as the first Verification, or before the first Verification.
                - listitem [ref=e1124]:
                  - text: If a Project Proponent wishes to
                  - link "renew the Crediting Period" [ref=e1125] [cursor=pointer]:
                    - /url: "#project-crediting"
                  - text: of a Project, an updated PDD must be provided and the Project must be re-Validated.
                - listitem [ref=e1126]: Unless otherwise specified in the relevant Certified Protocol, a site visit is required during the first Validation or Verification of a Project. For subsequent Verifications, the VVB must identify whether a site visit is needed, based on an independent risk assessment.
                - listitem [ref=e1127]: The level of assurance for Verifications must be reasonable.
              - paragraph [ref=e1128]: "Prior to Validation/Verification, the VVB must prepare a Validation/Verification plan that details the activities and schedules. The plan may be revised as necessary during the process. The plan must be communicated with the Project Proponent and must include, at minimum:"
              - list [ref=e1129]:
                - listitem [ref=e1130]: the scope and objectives;
                - listitem [ref=e1131]: identification of the Validation/Verification team and their roles;
                - listitem [ref=e1132]: client/responsible party contact;
                - listitem [ref=e1133]: schedule of activities;
                - listitem [ref=e1134]: level of assurance;
                - listitem [ref=e1135]: Verification criteria;
                - listitem [ref=e1136]: Materiality; and
                - listitem [ref=e1137]: schedule for site visits.
              - paragraph [ref=e1138]:
                - text: The Verifier must produce a report that documents the activities, results, findings, and conclusion of the Verification. The Verification report must contain, at a minimum
                - superscript [ref=e1139]:
                  - link "18" [ref=e1140] [cursor=pointer]:
                    - /url: "#user-content-fn-iso-14064-3:2019-6.3.3"
                - text: ":"
              - list [ref=e1141]:
                - listitem [ref=e1142]: a statement that the Project Proponent is responsible for the fair presentation of the PDD in accordance with the criteria;
                - listitem [ref=e1143]: a statement that the Verifier is responsible for expressing an opinion on the PDD based on the Verification;
                - listitem [ref=e1144]: a description of the Verification evidence-gathering procedures used to assess the PDD;
                - listitem [ref=e1145]: the Verification opinion, which will will state the net Removal and/or net Reduction during the covered period to a reasonable Level of Assurance;
                - listitem [ref=e1146]: the date of the report;
                - listitem [ref=e1147]: the Verifier’s location;
                - listitem [ref=e1148]: the Verifier’s signature;
                - listitem [ref=e1149]: a summary of the GHG Statement;
                - listitem [ref=e1150]: reference to the Verification criteria; and
                - listitem [ref=e1151]: Verification scope.
              - paragraph [ref=e1152]: Following this process, Isometric will review the Project documents used for Validation and Verification, and either accept them, request corrections or clarifications for the Project Proponent or VVB to address, or reject them. Once Isometric has reviewed and approved the initial Validation Report for a Project, the Project will be listed as Validated on the Registry, with the date of Isometric’s approval listed as the “Approval Date (The date on which Isometric approves the initial Validation Report for a Project, following which the Project will be listed as Validated on the Registry. (Also known as “Registration Date”).)” (also known as a “registration date”) of the Project. For Verifications, once Isometric has accepted a Verification Report, the corresponding Removals and Reductions will be deemed Verified, and eligible for issuance of Credits.
              - paragraph [ref=e1153]: For both Validations and Verifications, the results of the Validation/Verification process, including the Validation/Verification Report and Opinion, will be made available for each Project.
            - generic [ref=e1154]:
              - heading "4.3 Materiality Threshold" [level=3] [ref=e1155]
              - paragraph [ref=e1156]: The threshold for Materiality (An acceptable difference between reported Removals/emissions or Reductions/emissions and what an auditor determines is the actual Removal/emissions or Reduction/emissions.), considering the totality of all omissions, errors and mis-statements, is 5% of net Removal or Reduction for all Projects. To accept a Verification Opinion, Isometric requires that discrepancies between the Removal or Reduction Claimed by the Project Proponent and that estimated by the VVB for a given statement be less than the Materiality threshold.
              - paragraph [ref=e1157]:
                - text: Qualitative materiality issues may also be identified and documented, such as
                - superscript [ref=e1158]:
                  - link "19" [ref=e1159] [cursor=pointer]:
                    - /url: "#user-content-fn-iso-gum"
                - text: ":"
              - list [ref=e1160]:
                - listitem [ref=e1161]: control issues that erode the verifier’s confidence in the reported data;
                - listitem [ref=e1162]: poorly managed documented information;
                - listitem [ref=e1163]: difficulty in locating requested information;
                - listitem [ref=e1164]: noncompliance with regulations indirectly related to GHG emissions, removals or storage.
            - generic [ref=e1165]:
              - heading "4.4 Conflicts of Interest" [level=3] [ref=e1166]
              - paragraph [ref=e1167]: Any organization which has been involved in the development of a particular Project may not act as a VVB for Validation and/or Verification purposes for that Project.
              - paragraph [ref=e1168]: To minimize the risk of conflicts of interest occurring between the Project Proponent and the VVB, Isometric will select and engage VVBs for Project Validation and Verification, and VVBs must complete a conflict of interest disclosure.
            - generic [ref=e1169]:
              - heading "4.5 Rotation of Validation and Verification Bodies" [level=3] [ref=e1170]
              - paragraph [ref=e1171]: Isometric requires that Projects must work with a single VVB for no longer than five consecutive years. A given VVB may conduct Verification for a Project during no more than five out of seven consecutive years.
            - generic [ref=e1172]:
              - heading "4.6 Validation and Verification Body Oversight" [level=3] [ref=e1173]
              - paragraph [ref=e1174]:
                - text: In addition to the
                - link "qualification requirements" [ref=e1175] [cursor=pointer]:
                  - /url: "#validation-and-verification-body-qualification-requirements"
                - text: ", Isometric may oversee VVB activity during the Validation and/or Verification process, and may suspend approval of a previously approved VVB. Oversight can include review of VVB documentation, including Verification and sampling plans, reports, opinions and conflict of interest disclosures, as well as review of Project Proponent documentation."
              - paragraph [ref=e1176]: Isometric will report significant and/or repeated VVB performance concerns to the relevant accreditation body.
            - generic [ref=e1177]:
              - heading "5.0 Crediting" [level=2] [ref=e1178]
              - paragraph [ref=e1179]: "Isometric issues two Credit (A publicly visible uniquely identifiable Credit Certificate Issued by a Registry that gives the owner of the Credit the right to account for one net metric tonne of Verified CO₂e Removal or Reduction. In the case of this Standard, the net tonne of CO₂e Removal or Reduction comes from a Project Validated against a Certified Protocol.) Types:"
              - list [ref=e1180]:
                - listitem [ref=e1181]:
                  - text: Carbon Dioxide Removal credits, representing one net metric tonne of verified CO
                  - subscript [ref=e1182]: "2"
                  - text: e removal, and
                - listitem [ref=e1183]:
                  - text: Emission Reduction credits, representing one net metric tonne of verified CO
                  - subscript [ref=e1184]: "2"
                  - text: e reduction of specified greenhouse gasses generated by an existing emitter.
              - paragraph [ref=e1185]: Credits may be Issued, Transferred and Retired (The act of confirming the final ownership of a given Credit and permanent withdrawal from circulation. The Counterfactual of this act is the ultimate owner of the tonne of Removal or Reduction and the sole claimant as to its attributes for the purpose of carbon accounting.) on the Isometric Registry according to the rules and requirements set out in this section.
              - paragraph [ref=e1186]: Isometric is the sole Credit issuing body on the Isometric Registry.
            - generic [ref=e1187]:
              - heading "5.1 Credit Attributes" [level=3] [ref=e1188]
              - paragraph [ref=e1189]:
                - text: Credits have only one owner at any time. A full ownership history is tracked and is publicly visible for each Credit. Each Credit is Issued Ex-post (Issuance of Credits after removal or reduction took place. This is the manner in which Isometric Delivers Credits.) against a net Verified Removal or Reduction thereby ensuring every net tonne of CO
                - subscript [ref=e1190]: "2"
                - text: e emission impact is Credited and accounted for only
                - link "once" [ref=e1191] [cursor=pointer]:
                  - /url: "#no-double-counting"
                - text: ", and that any Credit can be traced back to an individual Removal or Reduction."
              - paragraph [ref=e1192]: Each Credit has a publicly available history of ownership that indicates when the Credit was first Issued, who it was first Issued to, if and when it was subsequently Delivered or Transferred, if and when it was Retired and by whom, on behalf of whom.
              - paragraph [ref=e1193]:
                - text: When first Issued, a Credit's status is Active. Upon Retirement of a Credit, its status becomes Retired. Similarly, upon Cancellation of a Credit (The permanent annulling of a Certificate to compensate for erroneous over-issuance or a Reversal. Once Canceled, the certificate will no longer be available for Delivery or Retirement.) (for example, in compensation for erroneous overissuance, or in compensation for a Reversal as outlined in
                - link "Reversals and Buffer Pools" [ref=e1194] [cursor=pointer]:
                  - /url: "#reversals-and-buffer-pools"
                - text: ), its status becomes Canceled (The permanent annulling of a Certificate to compensate for erroneous over-issuance or a Reversal. Once Canceled, the certificate will no longer be available for Delivery or Retirement.).
              - paragraph [ref=e1195]: "Credit metadata include:"
              - list [ref=e1196]:
                - listitem [ref=e1197]: Unique Serial Number;
                - listitem [ref=e1198]: Type (Removal or Reduction);
                - listitem [ref=e1199]: Durability;
                - listitem [ref=e1200]: Protocol version the Credit was issued against;
                - listitem [ref=e1201]: Issuance Date;
                - listitem [ref=e1202]: Issuing Project;
                - listitem [ref=e1203]: Issuing Project Proponent;
                - listitem [ref=e1204]: Country of Removal or Reduction;
                - listitem [ref=e1205]: Ownership history, including the current Owner (the Owner who is retiring the Credit) and all previous Owners and Transfer Dates;
                - listitem [ref=e1206]: Retirement Date;
                - listitem [ref=e1207]: Retirement Beneficiary;
                - listitem [ref=e1208]: Credit Status; and
                - listitem [ref=e1209]:
                  - generic [ref=e1210]:
                    - text: Vintage
                    - insertion [ref=e1211]: (The calendar year in which the underlying carbon removal or climate impact associated with a Certificate occurred, as determined by the end date of the relevant removal or reduction. This will commonly, but not necessarily, correspond to the year of Certificate issuance, as issuance may occur at a later date due to reporting or verification timelines. Where a method supports granular reporting data, or growth or process modelling, across a multi-year reporting period, Certificates may be split across multiple vintage years to reflect the calendar year in which each portion of removal or climate impact occurred. Where removals or climate impact cannot be robustly attributed to individual calendar years, the vintage is assigned based on the end date of that reporting period.)
                  - text: .
            - generic [ref=e1212]:
              - heading "5.2 Issuance Process" [level=3] [ref=e1213]
              - paragraph [ref=e1214]: Credits are Issued representing a specific Removal or Reduction. This process is undertaken once the net Removal or Reduction has been Verified against the respective Protocol. Credits are always Issued to the Project Proponent of the Removal or Reduction. The Project Proponent is then able to Deliver (The outcome of a Project Proponent providing Credits to fulfill Buyers' purchases.) Credits to Buyer Credit Accounts (A function of the Isometric Registry that allows either Buyers or Project Proponents to receive Issued Credits, either by way of direct Credit Issuance in the case of Project Proponents, or by way of a Credit Transfer in the case of a Buyer.) on the Registry, and can do so at a time and in an order of their own discretion.
            - generic [ref=e1215]:
              - heading "5.3 Transfer and Delivery Rules and Ownership History" [level=3] [ref=e1216]
              - paragraph [ref=e1217]: Deliveries can be made by Project Proponents to Buyer Credit Accounts, resulting in transfer of ownership of one or more newly Issued Credits. Further Transfers can be made by Credit Account holders to other Credit Accounts, resulting in transfer of ownership of one or more Credits. For each Credit, the initial Delivery and all Transfers are logged on the Credit and made publicly available in the Credit's history.
              - paragraph [ref=e1218]: "Project Proponent Deliveries are subject to the following rules:"
              - list [ref=e1219]:
                - listitem [ref=e1220]: Project Proponents can only Deliver Credits that have been Issued;
                - listitem [ref=e1221]: Project Proponents can only Deliver Credits that they own; and
                - listitem [ref=e1222]: Project Proponents can only Deliver Credits to Buyers who have an active Isometric Registry Credit Account.
              - paragraph [ref=e1223]: "Buyer Transfers are subject to the following rules:"
              - list [ref=e1224]:
                - listitem [ref=e1225]: Buyers can only transfer Credits that they own; and
                - listitem [ref=e1226]: Buyers can only transfer Credits to another organization that has a Credit Account on the Isometric Registry.
            - generic [ref=e1227]:
              - heading "5.4 Retirement Rules" [level=3] [ref=e1228]
              - paragraph [ref=e1229]:
                - text: Retirement is the mechanism by which a Credit's ownership state is finalized. This ensures that once the net tonne of CO
                - subscript [ref=e1230]: "2"
                - text: e represented by the retired Credit is used towards an accounting activity, it can never be used again by the owner, the Beneficiary of the retirement, or any other actor.
              - paragraph [ref=e1231]: The Beneficiary of a Retirement is the organization on behalf of whom the Credit was retired, and must be publicly identified. Beneficiaries can be the current holder of a Credit at the time of retirement, or an organization that is specified by the Credit Account holder during the Retirement procedure. The Credit Account holder can retire Credits by following the Retirement process through their Credit Account on the Registry.
              - paragraph [ref=e1232]: The owner of an unretired Credit may publicly market its ownership of said Credit, as well as the potential for the Credit to be retired by any current or future owners, but only the Beneficiary of a Retired Credit may claim the environmental benefits associated with that Credit.
              - paragraph [ref=e1233]: "Retirement is subject to the following rules:"
              - list [ref=e1234]:
                - listitem [ref=e1235]: a Credit Account holder can only retire Credits they own, which are in their Credit Account;
                - listitem [ref=e1236]: a Credit can only be Retired once; and
                - listitem [ref=e1237]: any number of Credits can be retired at any given time, provided that number of Credits does not exceed the number of Credits held by the Credit Account.
            - generic [ref=e1238]:
              - heading "5.5 Retirement Certificates" [level=3] [ref=e1239]
              - paragraph [ref=e1240]: Retirement Certificates serve as proof of the Retirement of one or more Credits, and are produced only on completion of a Retirement. Every Retirement Certificate relates to one or more Retired Credits. If more than one Credit is Retired at a time, the Certificate will list all Retired Credits. Retirement Certificates show the relationship between retired Credits and the Removals or Reductions they derive from.
            - generic [ref=e1241]:
              - heading "5.6 Reversals and Buffer Pools" [level=3] [ref=e1242]
              - paragraph [ref=e1243]: This section outlines how Reversals are handled on the Isometric Registry, through the use of Buffer Pools.
              - paragraph [ref=e1244]: All Reversals will be reviewed by the Isometric Science Team.
              - paragraph [ref=e1245]: Note that changes to calculations as a result of updates to Protocols are not considered Reversals, and will generally not affect previously issued Credits. However, Isometric will monitor for significant impacts due to Protocol updates to ensure overall quality and to address system level impacts (e.g. considerable evolution of scientific consensus).
            - generic [ref=e1246]:
              - heading "5.6.1 Reversals" [level=4] [ref=e1247]
              - generic [ref=e1248]:
                - text: "[G-F1WD-1, If there is a quantifiable amount of potential reversal, projects must document a plan to monitor and quantify the amount of potential Reversal that may occur via each identified reversal mechanism.]"
                - paragraph [ref=e1249]:
                  - text: Project Proponents must monitor for Reversals as prescribed by a Project's
                  - link "Monitoring Plan" [ref=e1250] [cursor=pointer]:
                    - /url: "#durability"
                  - text: ", and promptly report potential Reversals to Isometric if identified. Isometric’s expectation is for such a report to be made within one business day of having been identified, but must be made within a maximum of three business days. At the verification following a Reversal, the Project Proponent must report relevant monitoring data for any Reversal which has occurred, to be assessed by the verifier as part of that verification. Reversal data from Projects will be made public."
                - text: "[/G-F1WD-1]"
              - paragraph [ref=e1251]:
                - text: When a Reversal is identified, Credits will be Canceled from the Project Proponent's Buffer Pool to compensate for the Reversal, according to the requirements in
                - link "Buffer Pools" [ref=e1252] [cursor=pointer]:
                  - /url: "#buffer-pools"
                - text: .
              - paragraph [ref=e1253]: In the event that a Project Proponent is temporarily unable to comply with monitoring requirements as outlined in the relevant Protocol, the treatment of possible Reversals will be assessed on a case by case basis by Isometric, in consultation with the Project VVB.
              - paragraph [ref=e1254]: "Furthermore, Reversals are classed as either Avoidable or Unavoidable, according to the following requirements:"
              - list [ref=e1255]:
                - listitem [ref=e1256]: Where a Project Proponent ceases ongoing monitoring, this will be deemed an Avoidable Reversal.
                - listitem [ref=e1257]: Where a Reversal occurs over which the Project Proponent has influence or control, including for example in relation to poor project management or operational negligence, this will be deemed an Avoidable Reversal.
                - listitem [ref=e1258]: Where a Reversal occurs over which the Project Proponent has no control, including natural disasters, encroachment by outside actors, or occurrence of other demonstrably unforeseeable factors reasonably considered to be outside of the Project Proponent’s control, this will be deemed an Unavoidable Reversal.
              - paragraph [ref=e1259]:
                - text: The classification of a Reversal as either Avoidable or Unavoidable will be made by Isometric, in consultation with the Project VVB, according to the above requirements. This classification has implications in relation to the Project Proponent’s Buffer Pool, as outlined in
                - link "Buffer Pools" [ref=e1260] [cursor=pointer]:
                  - /url: "#buffer-pools"
                - text: .
            - generic [ref=e1261]:
              - heading "5.6.2 Buffer Pools" [level=4] [ref=e1262]
              - paragraph [ref=e1263]: Isometric will maintain a Buffer Pool of Credits in accounts specific to each Project Proponent, from which Credits will be Canceled in the case of a Reversal. The number of Credits to be Canceled must equal the size of the Reversal.
              - paragraph [ref=e1264]: In the case of Biosphere Protocols, a Buffer Pool of Credits specific to each Protocol will be maintained, and further requirements applicable to such Buffer Pools are set out in the applicable Protocols.
              - paragraph [ref=e1265]: Isometric reserves the right to amend its Buffer Pool approach given notice and consultation with Project Proponents in line with this Standard's Updates to Protocols policy.
              - paragraph [ref=e1266]: "By default, all Projects must make buffer pool contributions, except for Projects which meet either of the following criteria:"
              - list [ref=e1267]:
                - listitem [ref=e1268]:
                  - text: Projects deemed to have a “No observable risk” Risk of Reversal, as indicated in
                  - link "2.5.9 Risk of Reversal" [ref=e1269] [cursor=pointer]:
                    - /url: "#risk-of-reversal"
                  - text: ;
                - listitem [ref=e1270]:
                  - text: Projects operating within a recognised regulatory scheme that requires compensation for reversals, as outlined in
                  - link "5.6.2.1 Recognition of Equivalent Regulatory Schemes" [ref=e1271] [cursor=pointer]:
                    - /url: "#recognition-of-equivalent-regulatory-schemes"
                  - text: .
              - paragraph [ref=e1272]: For Projects contributing to a buffer pool, whenever Credits are Issued following a Verified Removal or Reduction, a percentage of these Credits will be Issued to the Project Proponent's Buffer Pool account, according to the Buffer Pool Size below.
              - paragraph [ref=e1273]: Credits in a Buffer Pool cannot be Transferred, or used to make Deliveries during the Crediting Period or after the Crediting Period has ended, as they are held to accommodate for as long as there is a risk of Reversal from a Project. Exceptions may occur when Uncertainty decreases and thus Buffer Pool size is amended for a Project Proponent, in which case extra Buffer Pool Credits may be used to make Deliveries.
              - paragraph [ref=e1274]: In the case that there are insufficient Credits in a Project Proponent's Buffer Pool to compensate for any triggered Reversals, all further Credits Issued from Removals and/or Reductions conducted by the Project Proponent (whether from the same Project, or other Projects run by the same Project Proponent) will be assigned to their Buffer Pool and Canceled, until all such Reversals have been fully compensated. Cases where Project Proponents cease operations will be addressed on an individual basis.
              - paragraph [ref=e1275]:
                - text: The Buffer Pool Size is determined by the Risk of Reversal of a given approach, as outlined below. The
                - link "Risk of Reversal" [ref=e1276] [cursor=pointer]:
                  - /url: "#risk-of-reversal"
                - text: is defined in the relevant Certified Protocol. Projects with a higher Risk of Reversal have a correspondingly larger Buffer Pool. Note that the Buffer Pool is applied in addition to the Conservative approach taken in the quantification of net CO
                - subscript [ref=e1277]: "2"
                - text: e Removal or Reduction, whereby uncertainty is factored into the Credited Removal or Reduction. The following Buffer Pool sizes may be subject to change in future Standard versions based on empirical data.
              - table [ref=e1278]:
                - rowgroup [ref=e1279]:
                  - row [ref=e1280]:
                    - columnheader [ref=e1281]:
                      - paragraph [ref=e1282]: Risk of Reversal
                    - columnheader [ref=e1283]:
                      - paragraph [ref=e1284]: Buffer Pool Size
                - rowgroup [ref=e1285]:
                  - row [ref=e1286]:
                    - cell [ref=e1287]:
                      - paragraph [ref=e1288]: No observable risk
                    - cell [ref=e1289]:
                      - paragraph [ref=e1290]: 0%
                  - row [ref=e1291]:
                    - cell [ref=e1292]:
                      - paragraph [ref=e1293]: Very low
                    - cell [ref=e1294]:
                      - paragraph [ref=e1295]: 1%
                  - row [ref=e1296]:
                    - cell [ref=e1297]:
                      - paragraph [ref=e1298]: Low
                    - cell [ref=e1299]:
                      - paragraph [ref=e1300]: 5%
                  - row [ref=e1301]:
                    - cell [ref=e1302]:
                      - paragraph [ref=e1303]: Medium
                    - cell [ref=e1304]:
                      - paragraph [ref=e1305]: 7%
                  - row [ref=e1306]:
                    - cell [ref=e1307]:
                      - paragraph [ref=e1308]: High
                    - cell [ref=e1309]:
                      - paragraph [ref=e1310]: 10-20%
              - paragraph [ref=e1311]: Where an Avoidable Reversal has occurred, a Project Proponent must reimburse their Buffer Pool account by transferring a number of Credits equal to the size of the Reversal to the Buffer Account. While there are any outstanding Avoidable Reversals to be remedied in this way, all further Credits Issued from Removals and/or Reductions conducted by the Project Proponent (whether from the same Project, or other Projects run by the same Project Proponent) will be assigned to their Buffer Pool, until all such Reversals have been fully remedied.
              - paragraph [ref=e1312]: Where an Unavoidable Reversal has occurred, the Project Proponent is not required to reimburse their Buffer Pool account.
            - generic [ref=e1313]:
              - heading "5.6.3 Buffer Pool Refunds" [level=4] [ref=e1314]
              - paragraph [ref=e1315]: Where a Project's Risk of Reversal assessment is revised downward, or where Isometric reduces the buffer pool contribution rate associated with a given risk category, the Project Proponent may be entitled to request a refund of the difference between credits previously contributed to the buffer pool and the amount that would have been required under the revised assessment or rate, so long as no Reversals have been triggered by the Project.
              - paragraph [ref=e1316]: Any such refund shall be contingent upon confirmation of the revised risk of reversal assessment by the Project’s VVB at the Project's next verification. Upon successful verification confirming the lower risk assessment, and confirmation of a refund request by Isometric, the applicable number of Credits will be transferred to the Project Proponent’s account.
              - paragraph [ref=e1317]: For the avoidance of doubt, where a change in Risk of Reversal assessment results from a material change in storage technology or a change to the Project's selected Storage Module(s) applicable only to new issuances—such that previous issuances would continue to be assessed at the original Risk of Reversal level—refunds under this section shall not apply to those previous issuances.
            - generic [ref=e1318]:
              - heading "5.6.4 Recognition of Equivalent Regulatory Schemes" [level=4] [ref=e1319]
              - paragraph [ref=e1320]: Where a Project Proponent can demonstrate that a Project is operating within a regulatory scheme that requires compensation for reversals, the Project may forgo Buffer Pool contributions. Recognition of an equivalent regulatory scheme means that reversals occurring under that scheme are considered compensated through the scheme’s own mechanisms, and the Project Proponent is not required to compensate for reversals through the Buffer Pool or other procedures defined in this Standard. The Project Proponent remains responsible for monitoring and reporting reversals in accordance with the Reversals requirements of this Standard.
              - paragraph [ref=e1321]: "The requirements for regulatory schemes to be considered as equivalent are:"
              - list [ref=e1322]:
                - listitem [ref=e1323]: A binding cap-and-trade scheme with zero free allowances for storage operators, such that any reversal is sufficiently compensated by an equivalent reduction in GHGs under the scheme.
                - listitem [ref=e1324]:
                  - text: A legally mandated requirement
                  - insertion [ref=e1325]: for the storage operator
                  - text: to be able to cover the full financial liability of the maximum possible storage inventory.
              - paragraph [ref=e1326]: "The following regulatory schemes are recognized as providing qualifying coverage:"
              - list [ref=e1327]:
                - listitem [ref=e1328]:
                  - strong [ref=e1329]: EU CCS Directive (Directive 2009/31/EC)
                  - text: ": Projects storing CO₂ in geological formations within EU member states, where the storage operator maintains financial security in accordance with Article 19."
              - paragraph [ref=e1330]: Suppliers seeking recognition under other regulatory schemes should contact Isometric with details of the applicable requirements. Recognition will be granted where Isometric determines the scheme provides substantially similar or improved protection compared to the buffer pool mechanism.
            - generic [ref=e1331]:
              - heading "5.6.5 Future Recognition of Insurance for Reversal Risk Mitigation" [level=4] [ref=e1332]
              - paragraph [ref=e1333]: Isometric is exploring the recognition of insurance as an alternative mechanism for mitigating reversal risk. Where Project Proponents are able to demonstrate qualifying insurance coverage that provides equivalent or improved protection against reversal events, Isometric may in future permit reduced or replaced buffer pool contributions. Criteria for qualifying insurance arrangements will be published as they are developed.
              - paragraph [ref=e1334]: Project Proponents interested in exploring insurance as an alternative to buffer pool contributions are encouraged to contact Isometric.
            - generic [ref=e1335]:
              - heading "5.7 No Double Counting" [level=3] [ref=e1336]
              - paragraph [ref=e1337]: Isometric has rules and procedures in place to mitigate the risk of occurrence of Double Counting, which can occur in different ways, including double issuance, double use and double claiming.
              - paragraph [ref=e1338]: Double issuance (occurring when more than one unique unit is Issued for the same Removal or Reduction activity) is not permissible, and Isometric has checks in place to mitigate the possibility of double issuance. Any Removal or Reduction activity listed on the Isometric registry must not be listed on another program, and may not be used to make a separate Removal or Reduction claim elsewhere. If the Project is associated with production of a commodity which is claiming an environmental attribute, the removals, or reductions may not be counted towards this environmental attribute.
              - paragraph [ref=e1339]: In addition, it is not permissible to issue Credits for Removals or Reductions resulting from Removal or Reduction activities where credits related to the same climate impacts of the activity are traded in any other carbon crediting program.
              - paragraph [ref=e1340]: "Furthermore, it is not permitted to register Removal or Reduction activities or Projects with overlapping GHG accounting boundaries, except in the following circumstances:"
              - list [ref=e1341]:
                - listitem [ref=e1342]: Projects whose physical Removal activities incorporate carbon sequestration which would individually be eligible under separate Isometric Protocols, and which may be registered as individual Projects under this Standard using separate Protocols; or
                - listitem [ref=e1343]: Projects which incorporate both Removal and Reduction activities that would individually be eligible under separate Isometric Protocols, and which may be registered as individual Projects under this Standard using separate Protocols.
              - paragraph [ref=e1344]: In both of the above circumstances, the GHG accounting boundary of the Project must not overlap with activities registered with any other carbon crediting program. Secondly, the GHG accounting boundary must be clearly described between such Projects to ensure that all carbon fluxes are fully accounted for precisely once, thereby avoiding the possibility of double issuance.
              - paragraph [ref=e1345]:
                - text: Double use (occurring when an Issued credit is further transferred, used or retired after already having been retired) is mitigated through a transparent, public record of all Credits and Retirements, ensuring all Retirements used as claims towards mitigation targets can be uniquely identified, and can be traced back to the specific Removal or Reduction activity the Credit was Issued against. Once a Credit has been Retired, it cannot be used further, and a unique, public
                - link "Retirement Certificate" [ref=e1346] [cursor=pointer]:
                  - /url: "#retirement-certificates"
                - text: is produced.
              - paragraph [ref=e1347]: Double claiming (occurring when an Issued credit is claimed twice towards achieving mitigation targets or goals) is not permitted on the Isometric Registry. For any Credit, no separate Removal or Reduction claims may be made for the underlying Removal or Reduction from which the Credit was Issued. Isometric will monitor for instances of Double claiming, and Credit Account users engaging in double claiming may have their Credit Account suspended.
            - generic [ref=e1348]:
              - heading "5.7.1 Prevention of Scheme Hopping" [level=4] [ref=e1349]
              - generic [ref=e1350]:
                - text: "[R-Q3JN-0, To mitigate the risks of double counting and scheme-hopping, Projects undergoing Validation must disclose any participation in other carbon standards or registries within the past five years, provide recent validation and verification audit reports (including findings and any suspensions or withdrawals), and state whether they withdrew from any prior scheme before completing a first verification.]"
                - paragraph [ref=e1351]: "To mitigate the risk of Double Counting and to prevent Projects seeking to avoid undertaking verification, monitoring, or corrective requirements through registration under alternative standards or programmes, Projects undergoing Validation must disclose:"
                - list [ref=e1352]:
                  - listitem [ref=e1353]: Whether the Project Proponent (or its legal predecessor) is currently participating in, or has participated in, another carbon certification scheme, carbon registry or standard within the last 5 years.
                  - listitem [ref=e1354]: Audit reports from the last two Validation and Verification processes under any previous scheme. This must include a detailed list of findings and any history of suspension or withdrawal in the last 5 years.
                  - listitem [ref=e1355]: Whether the Project Proponent withdrew from a previous scheme prior to the completion of a first Verification.
                - text: "[/R-Q3JN-0]"
            - generic [ref=e1356]:
              - heading "5.8 CORSIA" [level=3] [ref=e1357]
              - paragraph [ref=e1358]:
                - text: Project Proponents wishing to issue credits that would be eligible as emissions units for the Carbon Offsetting and Reduction Scheme for International Aviation (CORSIA) must comply with
                - link "Isometric’s CORSIA Eligibility Policy" [ref=e1359] [cursor=pointer]:
                  - /url: https://drive.google.com/file/d/18nnuCUaVn1DQDOeoSBCNDaS1XJ3jSFjw/view
                - text: .
              - paragraph [ref=e1360]: To mitigate the risk of double claiming of any CORSIA-eligible emissions units, Project Proponents must agree with Isometric suitable mechanisms to compensate for double claims of their CORSIA-eligible emissions units by airline operators for CORSIA and Host Countries working towards fulfillment of Nationally Determined Contributions (NDCs).
              - paragraph [ref=e1361]:
                - text: Project Proponents of CORSIA-eligible emissions must also comply with the information and reporting requirements in
                - link "Isometric’s CORSIA Eligibility Policy" [ref=e1362] [cursor=pointer]:
                  - /url: https://drive.google.com/file/d/18nnuCUaVn1DQDOeoSBCNDaS1XJ3jSFjw/view
                - text: ", including monitoring relevant Host Country reporting and submitting accurate, timely information on corresponding adjustments to Isometric."
              - paragraph [ref=e1363]: Project Proponents must report their sustainable development contributions or co-benefits in their Project Design Document, including indicators specified by Isometric and those that are publicly specified by a host country, for credits to be identified as CORSIA-eligible emissions units.
              - paragraph [ref=e1364]:
                - text: For Projects wishing to issue CORSIA Eligible Emission Units, a CORSIA Reversal Buffer Pool of Credits will be maintained with contributions determined by the Risk of Reversal defined in the relevant certified Protocol. More detail can be found in Isometric’s
                - link "CORSIA Eligibility Policy" [ref=e1365] [cursor=pointer]:
                  - /url: https://drive.google.com/file/d/18nnuCUaVn1DQDOeoSBCNDaS1XJ3jSFjw/view
                - text: .
              - paragraph [ref=e1366]:
                - text: Isometric commits to being the final guarantor of CORSIA-eligible emissions units, if other safeguards to reimburse CORSIA-eligible emissions units, such as a project's buffer pool contributions, other mechanisms outlined in
                - link "Buffer Pools" [ref=e1367] [cursor=pointer]:
                  - /url: "#buffer-pools"
                - text: or insurance policies, are insufficient to fully compensate for any reversal of issued CORSIA-eligible emission units. Further detail is provided in the
                - link "CORSIA Eligibility Policy" [ref=e1368] [cursor=pointer]:
                  - /url: https://drive.google.com/file/d/18nnuCUaVn1DQDOeoSBCNDaS1XJ3jSFjw/view
                - text: .
            - heading "5.9 Non-Conformities and Sanctions" [level=3] [ref=e1370]
            - generic [ref=e1371]:
              - heading "5.9.1 Non-Conformities" [level=4] [ref=e1372]
              - paragraph [ref=e1373]: "During a Validation or Verification conducted by a VVB, if any non-conformities with Protocol or Standard requirements are identified, the VVB will classify these non-conformities according to three categories: Minor Non-Conformity, Major Non-Conformity, and Critical Non-Conformity."
              - paragraph [ref=e1374]: The categorization of the non-conformity will determine the severity of the associated sanction Isometric will apply to the Project Proponent.
              - list [ref=e1375]:
                - listitem [ref=e1376]: "Minor Non-Conformity: a violation of the Isometric Standard or Protocol that has a limited impact, constitutes an isolated or temporary lapse, and would not result in a fundamental systemic failure if not corrected."
                - listitem [ref=e1377]:
                  - text: "Major Non-Conformity: a violation of the Isometric rules or procedures that has been repeated by the Project Proponent, revealing systematic problems either in combination with further non-conformities or on its own merit. This includes, but is not limited to:"
                  - list [ref=e1378]:
                    - listitem [ref=e1379]: systematic problems with GHG data reported, such as incorrect documentation identified in more than 10% of the claims included in the representative sample;
                    - listitem [ref=e1380]: failure to provide relevant information to the VVB, such as the information needed for the purposes of an audit;
                    - listitem [ref=e1381]: omission of a Project Proponent declaring its participation in other carbon removal or GHG reduction certification schemes during the certification process;
                - listitem [ref=e1382]: "Critical Non-Conformity: violations that jeopardize the integrity of the Isometric Standard, including fraud, irreversible non-conformity, falsification of GHG data, or deliberate misstatement of activity. For instance, fabrication of data or submission of fraudulent GHG statements."
              - paragraph [ref=e1383]:
                - text: For the purposes of the issuance of a CRCF certificate of compliance, a failure to meet the requirements of relevant Modules and Protocols approved under the CRCF, as well as the quality criteria set out in Articles 4 to 7 of Regulation (EU) 2024/3012
                - superscript [ref=e1384]:
                  - link "20" [ref=e1385] [cursor=pointer]:
                    - /url: "#user-content-fn-eu-regulation-2024-3012"
                - text: ", will also be categorized as a Critical Non-Conformity."
            - generic [ref=e1386]:
              - heading "5.9.2 Sanctions" [level=4] [ref=e1387]
              - paragraph [ref=e1388]:
                - text: Based on the classification of the non-conformities in
                - link "Non-Conformities" [ref=e1389] [cursor=pointer]:
                  - /url: "#non-conformities"
                - text: ", Isometric will apply the following sanctions, which are in accordance with the CRCF implementing regulation. The applicable sanction applied will depend on whether the Credits or CRCF Certificate of Compliance have been issued."
              - paragraph [ref=e1390]: In the case of a Minor Non-Conformity, the Project Proponent must remediate the issue during the current Validation or Verification, unless the VVB determines that it may be recorded as a Forward Action Request. Any such Forward Action Request must be addressed at the next verification, or by a date specified by the Verifier, and in any event within 12 months at the latest.
              - paragraph [ref=e1391]:
                - text: In the case of a Major Non-Conformity, if a Project has not been validated or a CRCF Certificate of Compliance has not been issued, the project will not be validated and no CRCF Certificate of Compliance will be issued until the non-conformity has been resolved. Where a CRCF Certificate of Compliance has already been issued or the Project has been validated, its Certificate of Compliance and further credit issuance to the Project will be suspended. The Project Proponent must implement remedial measures within 90 days of the major non-conformity being identified. If this remedial action does not occur within 90 days, the Project’s CRCF Certificate of Compliance will be
                - deletion [ref=e1392]: cancelled
                - insertion [ref=e1393]: canceled
                - text: and the Project will be delisted from the registry.
              - paragraph [ref=e1394]:
                - text: In the case of Critical Non-Conformity identified during a Verification or monitoring audit, or through Isometric's internal monitoring or complaints process, no further credits will be issued. Any Credits previously issued that are attributable to the Non-Conformity will be deemed as having undergone a Reversal, and the procedure in
                - link "Reversals" [ref=e1395] [cursor=pointer]:
                  - /url: "#reversals"
                - text: will apply. Any CRCF certified units will be subject to immediate cancellation and the remediation procedures described in
                - link "Remediation for Fraud" [ref=e1396] [cursor=pointer]:
                  - /url: "#remediation-for-fraud"
                - text: will apply.
              - paragraph [ref=e1397]:
                - text: In the case of a CRCF certificate of compliance, the certificate will be
                - deletion [ref=e1398]: cancelled
                - insertion [ref=e1399]: canceled
                - text: and there will be no further issuance of CRCF certified units
                - insertion [ref=e1400]: . In the case of Projects seeking eligibility under the CRCF, where Validation has been refused or the CRCF Certificate of Compliance has been cancelled following a Critical Non-Conformity, the Project Proponent (or its legal predecessor) may not re-apply for CRCF certification under the Isometric Standard until a period of at least 12 months has passed from the date of refusal or cancellation, in line with Article 7(3) of Commission Implementing Regulation (EU) 2025/2358. Re-application before the end of the fixed period will be rejected. Any re-application must demonstrate that the issues which led to the Critical Non-Conformity have been thoroughly addressed. Isometric may extend the fixed period beyond 12 months where the characteristics of the activity warrant a longer bar, in line with Article 7(3)
                - text: .
              - paragraph [ref=e1401]: Any further credit issuance to the Project will be suspended. In the case of Projects which are not seeking eligibility under CRCF, the Project Proponent may re-apply to issue credits if they demonstrate that the issues which lead to the Critical Non-Conformity have been thoroughly addressed.
            - generic [ref=e1402]:
              - heading "6.0 CRCF" [level=2] [ref=e1403]
              - paragraph [ref=e1404]: Project Proponents wishing to issue credits under the EU’s Carbon Removal and Carbon Farming certification scheme are subject to additional procedures and requirements to ensure they comply with the applicable legislation.
              - paragraph [ref=e1405]: Projects seeking Validation under the Isometric Standard must indicate whether they wish to be approved to issue CRCF certified units. If so, Projects must use an appropriate Isometric Protocol and must comply with the procedures and requirements described in this Section.
