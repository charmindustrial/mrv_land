            - generic [ref=e657]:
              - heading "3.3 Eligibility" [level=3] [ref=e658]
              - paragraph [ref=e659]: Projects are only eligible to claim Credits for activities that are exclusively registered with the Isometric Registry. Projects are only eligible to receive Credits on the Isometric Registry using an Isometric Certified Protocol.
              - paragraph [ref=e660]:
                - text: Prior to Project registration on the Isometric Registry, projects must undergo a
                - deletion [ref=e661]: "30"
                - insertion [ref=e662]: "10"
                - text: day public comment period. Isometric will review all comments received during that period, and share these with the Project Proponent and the Project’s appointed VVB.
              - paragraph [ref=e663]:
                - insertion [ref=e664]: If
                - insertion [ref=e665]: any material comments are received during the initial 10-day period, or a stakeholder requests additional time to provide input, Isometric will extend the public comment period to a total of 30 days.
              - paragraph [ref=e666]: In response to comments received, Isometric or the appointed VVB may issue clarification requests or corrective action requests to the Project Proponent during the validation process. Any such corrective action requests must be addressed by the Project Proponent during the validation process. Isometric will publish a summary of comments received once Project validation is complete.
              - paragraph [ref=e667]: At time of Project application and Validation, Projects must use the latest available version of a Certified Protocol, unless a grace period has been explicitly specified by Isometric, whereby a former version of a Protocol may continue to be used for a defined time period. Where Validation occurs after Project application, the Protocol version required is that which was latest at the time of application.
              - paragraph [ref=e668]: Projects must conform to all relevant laws and regulations in the jurisdiction in which they operate.
              - paragraph [ref=e669]:
                - text: Projects must be Additional, according to the guidance described in the Isometric Standard
                - link "Additionality" [ref=e670] [cursor=pointer]:
                  - /url: "#additionality"
                - text: approach.
              - paragraph [ref=e671]: Projects must use appropriate Emission Factors as set out in relevant Protocols. Protocols and modules set guidelines for the types of emissions factors and sources of emission factors that are acceptable.
              - paragraph [ref=e672]: The Project Proponent is responsible for notifying Isometric of any changes to operations that could change the eligibility of their process. Following notification, the project's eligibility must be assessed at the project's next verification.
            - generic [ref=e673]:
              - heading "3.4 Project Crediting" [level=3] [ref=e674]
              - paragraph [ref=e675]:
                - text: Projects are eligible to begin submitting GHG Statements to Isometric following
                - link "Project Validation" [ref=e676] [cursor=pointer]:
                  - /url: "#validation-and-verification-process"
                - text: . Once Removals or Reductions are Verified, they may be used to issue Credits. A single project can issue Removal credits, Reduction credits or both. See
                - link "Section 6" [ref=e677] [cursor=pointer]:
                  - /url: "#crediting"
                - text: for more information on Crediting.
              - paragraph [ref=e678]: The initial Crediting Period Start Date for a Project designates the beginning of operational removal or reduction activity for the Project. The requested Crediting Period Start Date must be no earlier than 5 years before the initial submission of the Project to the Registry. GHG Statements may be submitted for activity which took place on or following the Crediting Period Start Date.
              - paragraph [ref=e679]: Projects are eligible to Issue Credits for the duration of the Crediting Period specified in the Project's PDD. If a Project Proponent wishes to renew the Crediting Period of a Project, an updated PDD must be provided and the Project must be re-Validated. There is no limit on the number of times a project can be renewed providing it is still in compliance with the relevant Certified Protocol. In general, the maximum Crediting Period is 10 years, unless otherwise specified by the relevant Certified Protocol. The only Certified Protocols which currently allow for a longer period are the Biogenic Carbon Capture and Storage Protocol and Direct Air Capture Protocol, which each have a 15 year Crediting Period, and Biosphere Protocols in which the Crediting Period is defined per project.
              - paragraph [ref=e680]: Unless otherwise specified in the applicable Protocol or Module, if a validated Project has not undergone a verification for more than 12 months since the previous verification, an updated PDD must be provided and the Project must be re-Validated.
              - paragraph [ref=e681]: Isometric does not Issue Ex-ante Credits (Issuance of Credits prior to the carbon removal or GHG reduction taking place. Isometric does not Deliver Credits in this manner.).
            - generic [ref=e682]:
              - heading "3.5 Additionality" [level=3] [ref=e683]
